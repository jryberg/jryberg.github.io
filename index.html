<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest@securit:~$</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0a0a; color: #d4d4d4; font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', monospace; font-size: 14px; overflow: hidden; }
#terminal { height: 100%; padding: 12px; overflow-y: auto; cursor: text; }
#terminal::-webkit-scrollbar { width: 8px; }
#terminal::-webkit-scrollbar-track { background: #1a1a1a; }
#terminal::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
.line { white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
.prompt-user { color: #57c457; }
.prompt-sep { color: #d4d4d4; }
.prompt-path { color: #5f87d7; }
.prompt-dollar { color: #d4d4d4; }
#input-line { line-height: 1.4; white-space: pre; }
#input { position: fixed; left: -9999px; top: 0; opacity: 0; }

#cursor { display: inline-block; width: 8px; height: 1.2em; background: #d4d4d4; animation: blink 1s step-end infinite; vertical-align: text-bottom; }

#sl-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0a; z-index:2000; overflow:hidden; }

.x11-titlebar { display: flex; align-items: center; height: 24px; background: linear-gradient(to bottom, #c8c8c8, #a0a0a0); border-bottom: 2px groove #888; padding: 0 3px; cursor: default; user-select: none; -webkit-user-select: none; flex-shrink: 0; }
.x11-title { flex: 1; text-align: center; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; font-weight: bold; color: #000; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border: 1px inset #999; background: #b0b0b0; margin: 2px 4px; line-height: 18px; }
.x11-btn { width: 18px; height: 18px; background: #b4b4b4; border: 2px outset #d8d8d8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 11px; font-weight: bold; color: #000; padding: 0; line-height: 1; }
.x11-btn:active { border-style: inset; }

</style>
</head>
<body>
<div id="terminal"></div>
<script>
(function() {
  'use strict';

  // ── BusyBox emulation: environment & persistent filesystem ──────────────
  // The shell emulates `busybox ash` (BusyBox v1.37.0) with a large subset of
  // applets. Every change the visitor makes (vi, cp, rm, mkdir, redirections,
  // ...) is recorded in an overlay persisted to localStorage, so the browser
  // acts as the machine's disk and survives reloads. `fsreset -f` reformats.
  var BB_VERSION = '1.37.0';
  var BB_BUILD = '2026-06-06 12:00:00 UTC';
  var HOME = '/home/guest';
  var env = {
    HOME: HOME, USER: 'guest', LOGNAME: 'guest', SHELL: '/bin/sh',
    TERM: 'xterm-256color', HOSTNAME: 'securit',
    PATH: '/usr/bin:/usr/sbin:/bin:/sbin',
    PWD: HOME, OLDPWD: HOME, EDITOR: 'vi', LANG: 'C.UTF-8'
  };
  var lastExit = 0;
  var BOOT_TIME = Date.now();
  var BASE_MTIME = new Date(2026, 2, 1, 12, 0, 0).getTime();

  function dirEntry(children, extra) {
    var e = { type: 'dir', children: children || [], owner: 'root', group: 'root', mode: 'drwxr-xr-x', mtime: BASE_MTIME };
    if (extra) for (var k in extra) e[k] = extra[k];
    return e;
  }
  function fileEntry(content, extra) {
    var e = { type: 'file', content: content, owner: 'root', group: 'root', mode: '-rw-r--r--', mtime: BASE_MTIME };
    if (extra) for (var k in extra) e[k] = extra[k];
    return e;
  }
  function devEntry(kind, mode) {
    return { type: 'file', content: '', dev: kind, owner: 'root', group: 'root', mode: mode || 'crw-rw-rw-', mtime: BASE_MTIME };
  }
  function procEntry(kind) {
    return { type: 'file', content: '', proc: kind, owner: 'root', group: 'root', mode: '-r--r--r--', mtime: BASE_MTIME };
  }

  function buildBaseFS() {
    return {
      '/': dirEntry(['bin', 'dev', 'etc', 'home', 'proc', 'root', 'sbin', 'tmp', 'usr', 'var']),
      '/bin': dirEntry([]),   // populated with busybox applet links at boot
      '/sbin': dirEntry([]),
      '/bin/busybox': fileEntry('', { executable: true, mode: '-rwxr-xr-x' }),
      '/dev': dirEntry(['null', 'random', 'tty', 'urandom', 'vda1', 'zero']),
      '/dev/null': devEntry('null'),
      '/dev/zero': devEntry('zero'),
      '/dev/random': devEntry('random'),
      '/dev/urandom': devEntry('random'),
      '/dev/tty': devEntry('tty'),
      '/dev/vda1': devEntry('disk', 'brw-rw----'),
      '/etc': dirEntry(['group', 'hostname', 'hosts', 'motd', 'os-release', 'passwd', 'profile', 'resolv.conf', 'shadow']),
      '/etc/hostname': fileEntry('securit\n'),
      '/etc/hosts': fileEntry('127.0.0.1\tlocalhost\n127.0.1.1\tsecurit securit.se\n\n::1\tlocalhost ip6-localhost ip6-loopback\n'),
      '/etc/motd': fileEntry('Welcome to securit.se\n\nThis system runs BusyBox and your browser is its disk: everything you\nchange (vi, cp, rm, mkdir, >redirects, ...) is stored locally and\nsurvives reloads. Type `help` for built-ins, `busybox` for applets,\nand `fsreset -f` to reformat the disk back to factory state.\n'),
      '/etc/os-release': fileEntry('NAME="Securit Linux"\nVERSION="26.06"\nID=securit\nPRETTY_NAME="Securit Linux 26.06 (BusyBox v' + BB_VERSION + ')"\nHOME_URL="https://securit.se/"\n'),
      '/etc/passwd': fileEntry('root:x:0:0:root:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/false\nsshd:x:100:65534::/run/sshd:/bin/false\nguest:x:1000:1000:guest:/home/guest:/bin/sh\n'),
      '/etc/group': fileEntry('root:x:0:\ndaemon:x:1:\ndisk:x:6:\nguest:x:1000:\n'),
      '/etc/shadow': fileEntry('root:$6$rounds=656000$REDACTED:20200:0:99999:7:::\n', { mode: '-rw-------' }),
      '/etc/profile': fileEntry('# /etc/profile: system-wide profile for the Bourne shells\n\nexport PATH="/usr/bin:/usr/sbin:/bin:/sbin"\nif [ "$PS1" ]; then\n  cat /etc/motd 2>/dev/null\nfi\n'),
      '/etc/resolv.conf': fileEntry('nameserver 192.168.1.1\nsearch lan\n'),
      '/home': dirEntry(['guest']),
      '/home/guest': dirEntry(['.profile', 'Documents', 'contact.txt', 'projects.txt'], { owner: 'guest', group: 'guest' }),
      '/home/guest/.profile': fileEntry("# ~/.profile: executed by the ash shell at login.\n\nexport PS1='\\u@\\h:\\w\\$ '\nexport EDITOR=vi\n", { owner: 'guest', group: 'guest' }),
      '/home/guest/contact.txt': fileEntry('johan@ryberg.se\n', { owner: 'guest', group: 'guest' }),
      '/home/guest/projects.txt': fileEntry('Projects\n========\n\ngojinja\n-------\nA Go implementation of the Jinja2 template engine.\nFull support for Jinja2 syntax, designed for embedding in Go applications.\n\n  Source:  https://github.com/jryberg/gojinja\n  Docs:    https://securit.se/gojinja/stable/\n', { owner: 'guest', group: 'guest' }),
      '/home/guest/Documents': dirEntry([], { owner: 'guest', group: 'guest' }),
      '/proc': dirEntry(['cpuinfo', 'meminfo', 'uptime', 'version'], { mode: 'dr-xr-xr-x' }),
      '/proc/cpuinfo': procEntry('cpuinfo'),
      '/proc/meminfo': procEntry('meminfo'),
      '/proc/uptime': procEntry('uptime'),
      '/proc/version': procEntry('version'),
      '/root': dirEntry([], { mode: 'drwx------' }),
      '/tmp': dirEntry([], { mode: 'drwxrwxrwt' }),
      '/usr': dirEntry(['bin', 'sbin']),
      '/usr/bin': dirEntry(['clock', 'deerhunt', 'floppy']),
      '/usr/bin/clock': { type: 'file', content: '', executable: true, xapp: true, src: 'garden-clock.html', windowTitle: 'The Garden Clock', owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/bin/deerhunt': { type: 'file', content: '', executable: true, xapp: true, src: 'deerhunt.html', windowTitle: 'Deer Hunt', winW: 1024, winH: 720, owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/bin/floppy': { type: 'file', content: '', executable: true, xapp: true, src: 'floppy.html', windowTitle: 'Floppy', owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/sbin': dirEntry([]),
      '/var': dirEntry(['log']),
      '/var/log': dirEntry(['messages']),
      '/var/log/messages': fileEntry('Mar  1 12:00:01 securit syslogd started: BusyBox v' + BB_VERSION + '\nMar  1 12:00:01 securit kernel: EXT4-fs (vda1): mounted filesystem with ordered data mode\nMar  1 12:00:02 securit kernel: random: crng init done\nMar  1 12:00:03 securit sshd[204]: Server listening on 0.0.0.0 port 22.\n')
    };
  }

  var fs = null;   // populated by bootFS()

  // Persistence: the overlay maps absolute path -> entry (or null = deleted).
  var FS_KEY = 'securit.fs.v1';
  var HIST_KEY = 'securit.hist.v1';
  var overlay = {};
  var storageOK = true;

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function persistFS() {
    try { localStorage.setItem(FS_KEY, JSON.stringify(overlay)); storageOK = true; }
    catch (e) { storageOK = false; }
    return storageOK;
  }
  function markDirty(path) {
    overlay[path] = fs[path] || null;
  }
  function bootFS() {
    fs = buildBaseFS();
    registerAppletBinaries();
    var saved = loadJSON(FS_KEY);
    if (saved && typeof saved === 'object') {
      overlay = saved;
      Object.keys(overlay).forEach(function(p) {
        if (overlay[p] === null) delete fs[p];
        else fs[p] = overlay[p];
      });
    }
  }

  // Path helpers
  function normPath(p, base) {
    if (!p) return base || cwd;
    if (p === '~') p = env.HOME;
    else if (p.slice(0, 2) === '~/') p = env.HOME + p.slice(1);
    if (p.charAt(0) !== '/') p = (base || cwd) + '/' + p;
    var parts = p.split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i];
      if (!s || s === '.') continue;
      if (s === '..') out.pop();
      else out.push(s);
    }
    return '/' + out.join('/');
  }
  function parentOf(p) { var i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); }
  function baseName(p) { if (p === '/') return '/'; return p.slice(p.lastIndexOf('/') + 1); }
  function cloneEntry(e) { return JSON.parse(JSON.stringify(e)); }

  // Permissions: guest may read anything with the others-read bit (or own
  // files), and may only write below $HOME and /tmp.
  function canRead(path) {
    var e = fs[path];
    if (!e) return false;
    if (e.owner === 'guest') return true;
    return (e.mode || '').charAt(7) === 'r';
  }
  function canWritePath(path) {
    if (path === '/dev/null') return true;
    return path === HOME || path.indexOf(HOME + '/') === 0 || path === '/tmp' || path.indexOf('/tmp/') === 0;
  }

  function devRead(e) {
    if (e.dev === 'random') {
      var s = '';
      for (var i = 0; i < 192; i++) s += String.fromCharCode(33 + Math.floor(Math.random() * 94));
      return s + '\n';
    }
    return '';
  }
  function procRead(kind) {
    if (kind === 'uptime') {
      var up = (Date.now() - BOOT_TIME) / 1000 + 4242;
      return up.toFixed(2) + ' ' + (up * 0.97).toFixed(2) + '\n';
    }
    if (kind === 'version') {
      return 'Linux version 6.1.0-37-amd64 (builder@securit) (gcc (Debian 12.2.0-14) 12.2.0) #1 SMP PREEMPT_DYNAMIC Debian 6.1.140-1 (2025-05-22)\n';
    }
    if (kind === 'meminfo') {
      return 'MemTotal:        2013452 kB\nMemFree:         1524188 kB\nMemAvailable:    1730040 kB\nBuffers:           38124 kB\nCached:           281550 kB\nSwapTotal:             0 kB\nSwapFree:              0 kB\n';
    }
    if (kind === 'cpuinfo') {
      var n = (navigator.hardwareConcurrency || 2), s = '';
      for (var i = 0; i < n; i++) {
        s += 'processor\t: ' + i + '\nvendor_id\t: GenuineIntel\nmodel name\t: Intel(R) Xeon(R) CPU @ 2.20GHz\ncpu MHz\t\t: 2199.998\ncache size\t: 56320 KB\nbogomips\t: 4399.99\n\n';
      }
      return s;
    }
    return '';
  }

  // File primitives used by the applets. All return {ok:...} or {error:'...'}.
  function readFile(path) {
    var e = fs[path];
    if (!e) return { error: 'No such file or directory' };
    if (e.type === 'dir') return { error: 'Is a directory' };
    if (!canRead(path)) return { error: 'Permission denied' };
    if (e.dev) return { content: devRead(e) };
    if (e.proc) return { content: procRead(e.proc) };
    return { content: e.content };
  }
  function writeFile(path, content, opts) {
    opts = opts || {};
    var e = fs[path];
    if (e && (e.dev || path === '/dev/null')) return { ok: true };   // devices discard
    if (e && e.type === 'dir') return { error: 'Is a directory' };
    if (!canWritePath(path)) return { error: 'Permission denied' };
    if (!e) {
      var pp = parentOf(path), parent = fs[pp];
      if (!parent) return { error: 'No such file or directory' };
      if (parent.type !== 'dir') return { error: 'Not a directory' };
      e = { type: 'file', content: '', owner: 'guest', group: 'guest', mode: '-rw-r--r--', mtime: Date.now() };
      fs[path] = e;
      if (parent.children.indexOf(baseName(path)) < 0) parent.children.push(baseName(path));
      markDirty(pp);
    }
    e.content = opts.append ? e.content + content : content;
    e.mtime = Date.now();
    markDirty(path);
    if (!persistFS()) return { ok: true, warn: 'No space left on device' };
    return { ok: true };
  }
  function mkdirNode(path) {
    if (fs[path]) return { error: 'File exists' };
    var pp = parentOf(path), parent = fs[pp];
    if (!parent || parent.type !== 'dir') return { error: parent ? 'Not a directory' : 'No such file or directory' };
    if (!canWritePath(path)) return { error: 'Permission denied' };
    fs[path] = { type: 'dir', children: [], owner: 'guest', group: 'guest', mode: 'drwxr-xr-x', mtime: Date.now() };
    parent.children.push(baseName(path));
    markDirty(pp);
    markDirty(path);
    persistFS();
    return { ok: true };
  }
  function removeNode(path) {
    var e = fs[path];
    if (!e) return { error: 'No such file or directory' };
    if (!canWritePath(path)) return { error: 'Permission denied' };
    Object.keys(fs).forEach(function(p) {
      if (p === path || p.indexOf(path + '/') === 0) { delete fs[p]; overlay[p] = null; }
    });
    var pp = parentOf(path), parent = fs[pp];
    if (parent && parent.children) {
      var i = parent.children.indexOf(baseName(path));
      if (i >= 0) parent.children.splice(i, 1);
      markDirty(pp);
    }
    persistFS();
    return { ok: true };
  }

  function pathDirs() { return env.PATH.split(':').filter(Boolean); }

  var cwd = HOME;
  var prevDir = cwd;
  var history = loadJSON(HIST_KEY) || [];
  var historyIndex = history.length;
  function persistHistory() {
    if (history.length > 500) history = history.slice(history.length - 500);
    try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) { /* full disk */ }
  }
  var terminal = document.getElementById('terminal');

  // Process management (Linux-realistic PIDs)
  var bootProcs = [
    { pid: 1, user: 'root', cpu: '0.0', mem: '0.2', vsz: 169936, rss: 13284, tty: '?', stat: 'Ss', command: '/sbin/init' },
    { pid: 2, user: 'root', cpu: '0.0', mem: '0.0', vsz: 0, rss: 0, tty: '?', stat: 'S', command: '[kthreadd]' },
    { pid: 87, user: 'root', cpu: '0.0', mem: '0.1', vsz: 31608, rss: 5764, tty: '?', stat: 'Ss', command: '/lib/systemd/systemd-journald' },
    { pid: 112, user: 'root', cpu: '0.0', mem: '0.1', vsz: 22060, rss: 3428, tty: '?', stat: 'Ss', command: '/lib/systemd/systemd-udevd' },
    { pid: 198, user: 'root', cpu: '0.0', mem: '0.0', vsz: 6816, rss: 2964, tty: '?', stat: 'Ss', command: 'cron -f' },
    { pid: 204, user: 'root', cpu: '0.0', mem: '0.1', vsz: 15420, rss: 7060, tty: '?', stat: 'Ss', command: '/usr/sbin/sshd -D' },
    { pid: 312, user: 'root', cpu: '0.0', mem: '0.1', vsz: 17180, rss: 7416, tty: '?', stat: 'Ss', command: 'sshd: guest [priv]' },
    { pid: 354, user: 'guest', cpu: '0.0', mem: '0.1', vsz: 17180, rss: 4520, tty: '?', stat: 'S', command: 'sshd: guest@pts/0' }
  ];
  var shellPid = 355;
  var nextPid = 356;
  var processes = {};
  var jobs = {};
  var nextJobId = 1;
  var foregroundPid = null;
  var completedJobs = [];

  function escapeHTML(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function resolvePath(p) {
    if (p === '-') return prevDir;
    return normPath(p);
  }

  function getDisplayPath() {
    if (cwd === env.HOME) return '~';
    if (cwd.indexOf(env.HOME + '/') === 0) return '~' + cwd.slice(env.HOME.length);
    return cwd;
  }

  function buildPrompt() {
    var span = document.createElement('span');
    var user = document.createElement('span');
    user.className = 'prompt-user';
    user.textContent = 'guest@securit';
    var sep = document.createElement('span');
    sep.className = 'prompt-sep';
    sep.textContent = ':';
    var path = document.createElement('span');
    path.className = 'prompt-path';
    path.textContent = getDisplayPath();
    var dollar = document.createElement('span');
    dollar.className = 'prompt-dollar';
    dollar.textContent = '$ ';
    span.appendChild(user);
    span.appendChild(sep);
    span.appendChild(path);
    span.appendChild(dollar);
    return span;
  }

  // Terminal output with basic ANSI SGR (color/bold) support, so applets can
  // colorize like real busybox tools (ls --color, grep --color, ...).
  var SGR_COLORS = {
    30: '#0a0a0a', 31: '#e06c75', 32: '#57c457', 33: '#d7af5f', 34: '#5f87d7', 35: '#c678dd', 36: '#56b6c2', 37: '#d4d4d4',
    90: '#6b6b6b', 91: '#ff7b86', 92: '#7ce38b', 93: '#e5c07b', 94: '#7aa2f7', 95: '#d3a4f0', 96: '#7dcfff', 97: '#ffffff'
  };
  function appendAnsiText(div, text) {
    var re = /\x1b\[([0-9;]*)m/g;
    var idx = 0, m, bold = false, color = null;
    function emit(chunk) {
      if (!chunk) return;
      if (!bold && !color) { div.appendChild(document.createTextNode(chunk)); return; }
      var span = document.createElement('span');
      if (color) span.style.color = color;
      if (bold) span.style.fontWeight = 'bold';
      span.textContent = chunk;
      div.appendChild(span);
    }
    while ((m = re.exec(text))) {
      emit(text.slice(idx, m.index));
      idx = m.index + m[0].length;
      var codes = m[1] === '' ? [0] : m[1].split(';').map(Number);
      for (var i = 0; i < codes.length; i++) {
        if (codes[i] === 0) { bold = false; color = null; }
        else if (codes[i] === 1) bold = true;
        else if (SGR_COLORS[codes[i]]) color = SGR_COLORS[codes[i]];
      }
    }
    emit(text.slice(idx));
  }
  function addLine(text) {
    var div = document.createElement('div');
    div.className = 'line';
    var s = text === undefined || text === null ? '' : String(text);
    if (s === '') div.appendChild(document.createTextNode(' '));
    else appendAnsiText(div, s);
    terminal.insertBefore(div, inputLine);
  }

  function addCommandLine(cmdText) {
    var div = document.createElement('div');
    div.className = 'line';
    div.appendChild(buildPrompt());
    var textNode = document.createTextNode(cmdText);
    div.appendChild(textNode);
    terminal.insertBefore(div, inputLine);
  }

  function scrollToBottom() {
    terminal.scrollTop = terminal.scrollHeight;
  }

  // X11 window management
  var topZIndex = 1000;

  function bringToFront(win) {
    topZIndex++;
    win.style.zIndex = topZIndex;
  }

  function makeWindowDraggable(win, handle) {
    var dragging = false, startX, startY, origLeft, origTop;
    handle.addEventListener('mousedown', function(e) {
      if (e.target.tagName === 'BUTTON') return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      origLeft = parseInt(win.style.left) || 0;
      origTop = parseInt(win.style.top) || 0;
      var iframe = win.querySelector('iframe');
      if (iframe) iframe.style.pointerEvents = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      win.style.left = (origLeft + e.clientX - startX) + 'px';
      win.style.top = (origTop + e.clientY - startY) + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        var iframe = win.querySelector('iframe');
        if (iframe) iframe.style.pointerEvents = '';
      }
    });
  }

  function createX11Window(fileMeta, pid) {
    var win = document.createElement('div');
    win.className = 'x11-window';
    win.dataset.pid = pid;
    var w = Math.min(fileMeta.winW || 640, window.innerWidth - 40);
    var h = Math.min(fileMeta.winH || 520, window.innerHeight - 40);
    var offsetX = (Math.random() - 0.5) * 60;
    var offsetY = (Math.random() - 0.5) * 60;
    win.style.width = w + 'px';
    win.style.height = h + 'px';
    win.style.left = Math.max(10, (window.innerWidth - w) / 2 + offsetX) + 'px';
    win.style.top = Math.max(10, (window.innerHeight - h) / 2 + offsetY) + 'px';

    var titlebar = document.createElement('div');
    titlebar.className = 'x11-titlebar';
    var btnMin = document.createElement('button');
    btnMin.className = 'x11-btn';
    btnMin.textContent = '_';
    btnMin.title = 'Minimize';
    var title = document.createElement('div');
    title.className = 'x11-title';
    title.textContent = fileMeta.windowTitle || 'X11 Application';
    var btnMax = document.createElement('button');
    btnMax.className = 'x11-btn';
    btnMax.textContent = '\u25a1';
    btnMax.title = 'Maximize';
    var btnClose = document.createElement('button');
    btnClose.className = 'x11-btn';
    btnClose.textContent = 'X';
    btnClose.title = 'Close';
    titlebar.appendChild(btnMin);
    titlebar.appendChild(title);
    titlebar.appendChild(btnMax);
    titlebar.appendChild(btnClose);

    var body = document.createElement('div');
    body.className = 'x11-body';
    var iframe = document.createElement('iframe');
    iframe.src = fileMeta.src;
    iframe.allow = 'pointer-lock; fullscreen';
    body.appendChild(iframe);

    win.appendChild(titlebar);
    win.appendChild(body);
    document.body.appendChild(win);

    btnClose.addEventListener('click', function() { killProcess(pid); });
    btnMin.addEventListener('click', function() { win.style.display = 'none'; });
    var maximized = false;
    var origStyle = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
    btnMax.addEventListener('click', function() {
      if (!maximized) {
        origStyle = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
        win.style.left = '0'; win.style.top = '0'; win.style.width = '100vw'; win.style.height = '100vh';
      } else {
        win.style.width = origStyle.width; win.style.height = origStyle.height;
        win.style.left = origStyle.left; win.style.top = origStyle.top;
      }
      maximized = !maximized;
    });
    makeWindowDraggable(win, titlebar);
    win.addEventListener('mousedown', function() { bringToFront(win); });
    return win;
  }

  // Process lifecycle
  function disableTerminalInput() {
    input.disabled = true;
    cursor.style.display = 'none';
    inputLine.style.display = 'none';
  }

  function enableTerminalInput() {
    input.disabled = false;
    cursor.style.display = '';
    inputLine.style.display = '';
    input.focus();
  }

  function spawnXApp(command, fileMeta, background) {
    var pid = nextPid++;
    var proc = { pid: pid, command: command, jobId: null, windowEl: null, startTime: new Date(), status: 'running' };
    proc.windowEl = createX11Window(fileMeta, pid);
    processes[pid] = proc;
    if (background) {
      var jobId = nextJobId++;
      proc.jobId = jobId;
      jobs[jobId] = { jobId: jobId, pid: pid, command: command, status: 'running' };
      addLine('[' + jobId + '] ' + pid);
    } else {
      foregroundPid = pid;
      disableTerminalInput();
    }
  }

  function killProcess(pid) {
    var proc = processes[pid];
    if (!proc) return false;
    if (proc.intervalId) clearInterval(proc.intervalId);
    if (proc.windowEl && proc.windowEl.parentNode) proc.windowEl.parentNode.removeChild(proc.windowEl);
    if (foregroundPid === pid) {
      foregroundPid = null;
      enableTerminalInput();
      updatePrompt();
      scrollToBottom();
    }
    if (proc.jobId && jobs[proc.jobId]) {
      jobs[proc.jobId].status = 'done';
      completedJobs.push(jobs[proc.jobId]);
    }
    proc.status = 'done';
    delete processes[pid];
    if (proc.onExit) proc.onExit();
    return true;
  }

  function reportCompletedJobs() {
    while (completedJobs.length > 0) {
      var job = completedJobs.shift();
      addLine('[' + job.jobId + ']+  Done                    ' + job.command);
      delete jobs[job.jobId];
    }
  }

  // PATH resolution (for the X11 apps living in /usr/bin)
  function resolveFromPath(cmdName) {
    var dirs = pathDirs();
    for (var i = 0; i < dirs.length; i++) {
      var binPath = dirs[i] + '/' + cmdName;
      var entry = fs[binPath];
      if (entry && entry.type === 'file' && entry.executable) return { path: binPath, entry: entry };
    }
    return null;
  }

  function formatPsTime(d) {
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function formatDate(d) {
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var day = days[d.getDay()];
    var month = months[d.getMonth()];
    var date = d.getDate().toString();
    if (date.length === 1) date = ' ' + date;
    var h = d.getHours().toString().padStart(2, '0');
    var m = d.getMinutes().toString().padStart(2, '0');
    var s = d.getSeconds().toString().padStart(2, '0');
    return day + ' ' + month + ' ' + date + ' ' + h + ':' + m + ':' + s + ' ' + d.getFullYear();
  }

  // ── Shell: tokenizer ─────────────────────────────────────────────────────
  // Tokens are operators ({op:'|'}) or words: lists of {text, quote} segments
  // where quote is null (expandable), "'" (literal) or '"' (vars expand).
  function tokenize(line) {
    var toks = [], i = 0, n = line.length, cur = null;
    function seg(text, quote) {
      if (!cur) cur = { word: [] };
      cur.word.push({ text: text, quote: quote });
    }
    function flush() { if (cur) { toks.push(cur); cur = null; } }
    while (i < n) {
      var c = line[i];
      if (c === ' ' || c === '\t') { flush(); i++; continue; }
      if (c === '#' && !cur) break;
      if (c === "'") {
        var j = line.indexOf("'", i + 1);
        if (j < 0) return { error: 'syntax error: unterminated quoted string' };
        seg(line.slice(i + 1, j), "'");
        i = j + 1; continue;
      }
      if (c === '"') {
        var buf = '', k = i + 1, closed = false;
        while (k < n) {
          var d = line[k];
          if (d === '\\' && k + 1 < n && '"\\$`'.indexOf(line[k + 1]) >= 0) { buf += line[k + 1]; k += 2; continue; }
          if (d === '"') { closed = true; break; }
          buf += d; k++;
        }
        if (!closed) return { error: 'syntax error: unterminated quoted string' };
        seg(buf, '"');
        i = k + 1; continue;
      }
      if (c === '\\' && i + 1 < n) { seg(line[i + 1], "'"); i += 2; continue; }
      if (c === '&' && line[i + 1] === '&') { flush(); toks.push({ op: '&&' }); i += 2; continue; }
      if (c === '|' && line[i + 1] === '|') { flush(); toks.push({ op: '||' }); i += 2; continue; }
      if (c === '|') { flush(); toks.push({ op: '|' }); i++; continue; }
      if (c === ';') { flush(); toks.push({ op: ';' }); i++; continue; }
      if (c === '&') { flush(); toks.push({ op: '&' }); i++; continue; }
      if (c === '2' && !cur && line[i + 1] === '>') {
        if (line[i + 2] === '>') { toks.push({ op: '2>>' }); i += 3; continue; }
        if (line[i + 2] === '&' && line[i + 3] === '1') { toks.push({ op: '2>&1' }); i += 4; continue; }
        toks.push({ op: '2>' }); i += 2; continue;
      }
      if (c === '>') {
        flush();
        if (line[i + 1] === '>') { toks.push({ op: '>>' }); i += 2; } else { toks.push({ op: '>' }); i++; }
        continue;
      }
      if (c === '<') { flush(); toks.push({ op: '<' }); i++; continue; }
      var start = i;
      while (i < n && ' \t\'"\\|&;<>'.indexOf(line[i]) < 0) i++;
      seg(line.slice(start, i), null);
    }
    flush();
    return { toks: toks };
  }

  // ── Shell: expansion ($VAR, ${VAR}, $?, ~, globs) ────────────────────────
  function expandVars(text) {
    var out = '', i = 0, m;
    while (i < text.length) {
      if (text[i] === '$') {
        if (text[i + 1] === '?') { out += String(lastExit); i += 2; continue; }
        if (text[i + 1] === '$') { out += String(shellPid); i += 2; continue; }
        if (text[i + 1] === '{') {
          var j = text.indexOf('}', i);
          if (j > 0) { out += env[text.slice(i + 2, j)] || ''; i = j + 1; continue; }
        }
        m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(text.slice(i + 1));
        if (m) { out += env[m[0]] !== undefined ? env[m[0]] : ''; i += 1 + m[0].length; continue; }
      }
      out += text[i]; i++;
    }
    return out;
  }
  function globToRegExp(pat) {
    var re = '^';
    for (var i = 0; i < pat.length; i++) {
      var c = pat[i];
      if (c === '*') re += '[^/]*';
      else if (c === '?') re += '[^/]';
      else re += c.replace(/[.+^${}()|[\]\\]/g, '\\$&');
    }

          case 'B': return MONTHS_FULL[d.getMonth()];
          case 'j': return String(Math.ceil((d - new Date(d.getFullYear(), 0, 0)) / 86400000)).padStart(3, '0');
          case 'n': return '\n';
          default: return '%';
        }
      });
      ctx.println(out);
      return 0;
    },
    cal: function(ctx) {
      var d = new Date();
      var year = d.getFullYear(), month = d.getMonth();
      if (ctx.args.length >= 2) {
        month = parseInt(ctx.args[0], 10) - 1;
        year = parseInt(ctx.args[1], 10);
        if (isNaN(month) || isNaN(year) || month < 0 || month > 11) { ctx.error('invalid date'); return 1; }
      }
      var MONTHS_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      var head = MONTHS_FULL[month] + ' ' + year;
      var pad = Math.floor((20 - head.length) / 2);
      ctx.println(' '.repeat(Math.max(0, pad)) + head);
      ctx.println('Su Mo Tu We Th Fr Sa');
      var first = new Date(year, month, 1).getDay();
      var days = new Date(year, month + 1, 0).getDate();
      var today = (year === d.getFullYear() && month === d.getMonth()) ? d.getDate() : -1;
      var line = '   '.repeat(first).slice(0, first * 3);
      for (var day = 1; day <= days; day++) {
        var cell = String(day).padStart(2, ' ');
        if (day === today && ctx.tty) cell = '\x1b[1;32m' + cell + '\x1b[0m';
        line += cell + ' ';
        if ((first + day) % 7 === 0) { ctx.println(line.replace(/\s+$/, '')); line = ''; }
      }
      if (line.trim()) ctx.println(line.replace(/\s+$/, ''));
      return 0;
    },
    uptime: function(ctx) {
      var up = Math.floor((Date.now() - BOOT_TIME) / 1000) + 183042;
      var days = Math.floor(up / 86400);
      var hrs = Math.floor((up % 86400) / 3600);
      var mins = Math.floor((up % 3600) / 60);
      var t = new Date();
      ctx.println(' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0') +
        ' up ' + days + ' days, ' + String(hrs).padStart(2) + ':' + String(mins).padStart(2, '0') +
        ',  1 user,  load average: 0.00, 0.01, 0.05');
      return 0;
    },
    free: function(ctx) {
      ctx.println('              total        used        free      shared  buff/cache   available');
      ctx.println('Mem:    ' + fmtK(2013452) + fmtK(331898) + fmtK(1524188) + fmtK(1024) + fmtK(157366) + fmtK(1730040));
      ctx.println('Swap:   ' + fmtK(0) + fmtK(0) + fmtK(0));
      return 0;
    },
    dmesg: function(ctx) {
      [
        '[    0.000000] Linux version 6.1.0-37-amd64 (builder@securit) #1 SMP PREEMPT_DYNAMIC',
        '[    0.001204] Command line: BOOT_IMAGE=/boot/vmlinuz root=/dev/vda1 ro quiet',
        '[    0.142551] Memory: 2013452K/2097152K available',
        '[    0.401180] virtio_blk virtio1: [vda] 10485760 512-byte logical blocks (5.37 GB/5.00 GiB)',
        '[    0.622013] EXT4-fs (vda1): mounted filesystem with ordered data mode. Quota mode: none.',
        '[    1.093392] random: crng init done',
        '[    1.244819] eth0: link up, 1000 Mbps, full duplex',
        '[    2.001240] browserfs: localStorage overlay mounted on /home (persistent)',
        '[    4.192011] deerhunt: wildlife subsystem initialized, 3 rifles registered',
        '[    6.017743] sshd[204]: listening on 0.0.0.0 port 22'
      ].forEach(function(l) { ctx.println(l); });
      return 0;
    },
    mount: function(ctx) {
      ctx.println('/dev/vda1 on / type ext4 (rw,relatime)');
      ctx.println('proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)');
      ctx.println('devtmpfs on /dev type devtmpfs (rw,nosuid,noexec,relatime)');
      ctx.println('tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev)');
      ctx.println('localStorage on /home type browserfs (rw,relatime,persistent)');
      return 0;
    },
    which: function(ctx) {
      var code = 0;
      for (var i = 0; i < ctx.args.length; i++) {
        var nm = ctx.args[i];
        if (applets[nm]) ctx.println('/bin/' + nm);
        else {
          var rx = resolveFromPath(nm);
          if (rx) ctx.println(rx.path);
          else code = 1;
        }
      }
      return code;
    },
    clear: function(ctx) {
      if (ctx.tty) clearTerminal();
      return 0;
    },
    reset: function(ctx) {
      if (ctx.tty) clearTerminal();
      return 0;
    },
    ps: function(ctx) {
      var now = new Date();
      ctx.println('USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND');
      for (var i = 0; i < bootProcs.length; i++) {
        var bp = bootProcs[i];
        ctx.println(bp.user.padEnd(8) + ' ' + bp.pid.toString().padStart(4) + '  ' + bp.cpu + '  ' + bp.mem + ' ' + bp.vsz.toString().padStart(6) + ' ' + bp.rss.toString().padStart(5) + ' ' + bp.tty.padEnd(8) + ' ' + bp.stat.padEnd(4) + ' ' + formatPsTime(now) + '   0:00 ' + bp.command);
      }
      ctx.println('guest    ' + shellPid.toString().padStart(4) + '  0.0  0.1  22456  5432 pts/0    Ss   ' + formatPsTime(now) + '   0:00 -sh');
      var pids = Object.keys(processes);
      for (var j = 0; j < pids.length; j++) {
        var proc = processes[pids[j]];
        var stat = (foregroundPid === proc.pid) ? 'S+  ' : 'S   ';
        ctx.println('guest   ' + proc.pid.toString().padStart(5) + '  0.2  0.3  45200  8192 pts/0    ' + stat + formatPsTime(proc.startTime) + '   0:00 ' + proc.command);
      }
      ctx.println('guest   ' + nextPid.toString().padStart(5) + '  0.0  0.0  15320  2048 pts/0    R+   ' + formatPsTime(now) + '   0:00 ps ' + (ctx.args.join(' ') || 'aux'));
      return 0;
    },
    kill: function(ctx) {
      if (!ctx.args.length) { ctx.err('kill: usage: kill [-s sigspec | -n signum | -sigspec] pid | jobspec ...'); return 1; }
      var code = 0;
      for (var i = 0; i < ctx.args.length; i++) {
        if (ctx.args[i].charAt(0) === '-') continue;
        var pid = parseInt(ctx.args[i], 10);
        if (isNaN(pid)) { ctx.err('sh: kill: ' + ctx.args[i] + ': arguments must be process or job IDs'); code = 1; continue; }
        if (pid === shellPid || bootProcs.some(function(bp) { return bp.pid === pid; })) {
          ctx.err('sh: kill: (' + pid + ') - Operation not permitted');
          code = 1;
          continue;
        }
        if (!killProcess(pid)) { ctx.err('sh: kill: (' + pid + ') - No such process'); code = 1; }
      }
      return code;
    },
    jobs: function(ctx) {
      var jobIds = Object.keys(jobs);
      for (var i = 0; i < jobIds.length; i++) {
        var job = jobs[jobIds[i]];
        var status = job.status === 'running' ? 'Running' : 'Done';
        ctx.println('[' + job.jobId + ']+  ' + status + '                 ' + job.command + (job.status === 'running' ? ' &' : ''));
      }
      return 0;
    },
    man: function(ctx) {
      if (!ctx.args.length) { ctx.println('What manual page do you want?'); return 1; }
      var page = MAN_PAGES[ctx.args[0]];
      if (!page) { ctx.println('No manual entry for ' + ctx.args[0]); return 1; }
      page.forEach(function(l) { ctx.println(l); });
      return 0;
    },
    sudo: function(ctx) {
      ctx.println('[sudo] password for guest: ');
      ctx.println('guest is not in the sudoers file. This incident will be reported.');
      return 1;
    },
    su: function(ctx) {
      ctx.println('Password: ');
      ctx.println('su: Authentication failure');
      return 1;
    },
    md5sum: function(ctx) { ctx.error('not available on this system (no crypto in the disk driver)'); return 1; },
    sl: function(ctx) { ctx.err('sl: redirected? trains only run on terminals'); return 1; },
    sleep: function(ctx) {
      if (!ctx.args.length || isNaN(parseFloat(ctx.args[0]))) { ctx.error("invalid number '" + (ctx.args[0] || '') + "'"); return 1; }
      return 0;
    },
    yes: function(ctx) {
      var word = ctx.args.length ? ctx.args.join(' ') : 'y';
      for (var i = 0; i < 4096; i++) ctx.println(word);
      return 0;
    },
    vi: function(ctx) {
      ctx.err('vi: standard input is not a terminal');
      return 1;
    },
    poweroff: function(ctx) { ctx.error('must be root (and this is a web page)'); return 1; },
    reboot: function(ctx) { ctx.error('must be root — try reloading the page instead'); return 1; },
    'true': function() { return 0; },
    'false': function() { return 1; }
  });

  // ── Interactive launchers (standalone commands at the tty) ───────────────
  function runInteractive(name, args, cont) {
    if (name === 'sl') {
      var proc = runSL(args);
      if (proc) proc.onExit = function() { lastExit = 0; if (cont) cont(); };
      return 'async';
    }
    if (name === 'vi') return launchVi(args, cont);
    if (name === 'sleep') return runSleep(args, cont);
    if (name === 'yes') return runYes(args, cont);
  }

  function runSleep(args, cont) {
    var secs = parseFloat(args[0]);
    if (isNaN(secs) || secs < 0) {
      addLine("sleep: invalid number '" + (args[0] || '') + "'");
      lastExit = 1;
      return;
    }
    var pid = nextPid++;
    var proc = { pid: pid, command: 'sleep ' + args.join(' '), startTime: new Date(), status: 'running', jobId: null };
    processes[pid] = proc;
    foregroundPid = pid;
    disableTerminalInput();
    var timer = setTimeout(function() { finish(false); }, Math.min(secs, 86400) * 1000);
    function keyHandler(e) {
      if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); finish(true); }
    }
    function finish(interrupted) {
      clearTimeout(timer);
      document.removeEventListener('keydown', keyHandler);
      delete processes[pid];
      if (foregroundPid === pid) foregroundPid = null;
      if (interrupted) addLine('^C');
      lastExit = interrupted ? 130 : 0;
      enableTerminalInput();
      updatePrompt();
      scrollToBottom();
      if (!interrupted && cont) cont();
    }
    document.addEventListener('keydown', keyHandler);
    return 'async';
  }

  function runYes(args, cont) {
    var word = args.length ? args.join(' ') : 'y';
    var pid = nextPid++;
    var proc = { pid: pid, command: 'yes' + (args.length ? ' ' + args.join(' ') : ''), startTime: new Date(), status: 'running', jobId: null, intervalId: null };
    processes[pid] = proc;
    foregroundPid = pid;
    disableTerminalInput();
    proc.intervalId = setInterval(function() {
      for (var i = 0; i < 32; i++) addLine(word);
      var lines = terminal.querySelectorAll('.line');
      for (var j = 0; j < lines.length - 2000; j++) lines[j].remove();
      scrollToBottom();
    }, 60);
    function keyHandler(e) {
      if (e.key === 'c' && e.ctrlKey) {
        e.preventDefault();
        clearInterval(proc.intervalId);
        document.removeEventListener('keydown', keyHandler);
        delete processes[pid];
        if (foregroundPid === pid) foregroundPid = null;
        addLine('^C');
        lastExit = 130;
        enableTerminalInput();
        updatePrompt();
        scrollToBottom();
      }
    }
    document.addEventListener('keydown', keyHandler);
    return 'async';
  }

  // ── vi (BusyBox-style modal editor; :w persists to browser storage) ─────
  function launchVi(args, cont) {
    var fileArg = null;
    for (var ai = 0; ai < args.length; ai++) {
      if (args[ai].charAt(0) !== '-') { fileArg = args[ai]; break; }
    }
    var path = fileArg ? normPath(fileArg) : null;
    var buf = [''];
    var newFile = true;
    if (path && fs[path]) {
      if (fs[path].type === 'dir') { addLine('vi: ' + fileArg + ': Is a directory'); lastExit = 1; return; }
      var r0 = readFile(path);
      if (r0.error) { addLine('vi: ' + fileArg + ': ' + r0.error); lastExit = 1; return; }
      buf = r0.content.split('\n');
      if (buf.length > 1 && buf[buf.length - 1] === '') buf.pop();
      if (!buf.length) buf = [''];
      newFile = false;
    }

    // Screen metrics (same probe trick as sl)
    var probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-family:"Cascadia Code","Fira Code","JetBrains Mono",Consolas,Monaco,monospace;font-size:14px;line-height:1.4';
    probe.textContent = 'MMMMMMMMMM';
    document.body.appendChild(probe);
    var cw = probe.offsetWidth / 10 || 8.4;
    var ch = probe.offsetHeight || 20;
    document.body.removeChild(probe);
    var COLS = Math.max(40, Math.floor((window.innerWidth - 16) / cw));
    var ROWS = Math.max(10, Math.floor((window.innerHeight - 16) / ch)) - 1;   // last row = status

    var vOverlay = document.createElement('div');
    vOverlay.id = 'vi-overlay';
    var pre = document.createElement('pre');
    pre.id = 'vi-pre';
    vOverlay.appendChild(pre);
    document.body.appendChild(vOverlay);

    var pid = nextPid++;
    var proc = { pid: pid, command: 'vi' + (args.length ? ' ' + args.join(' ') : ''), startTime: new Date(), status: 'running', windowEl: vOverlay, jobId: null };
    processes[pid] = proc;
    foregroundPid = pid;
    disableTerminalInput();

    var mode = 'normal';       // normal | insert | cmd
    var cy = 0, cx = 0, top = 0;
    var pending = '';          // g, d, y, r, Z prefixes
    var cmdline = '';          // after : or /
    var cmdKind = ':';
    var message = fileArg
      ? '"' + fileArg + '"' + (newFile ? ' [New file]' : ' ' + buf.length + 'L, ' + (buf.join('\n').length + 1) + 'C')
      : '';
    var modified = false;
    var yankBuf = null;        // {lines: [...]}
    var undoStack = [];
    var lastSearch = null;

    function pushUndo() {
      undoStack.push({ buf: buf.slice(), cy: cy, cx: cx });
      if (undoStack.length > 100) undoStack.shift();
    }
    function snapshot() {
      pushUndo();
      modified = true;
    }
    function clampCursor(insertMode) {
      if (cy < 0) cy = 0;
      if (cy > buf.length - 1) cy = buf.length - 1;
      var max = Math.max(0, buf[cy].length - (insertMode ? 0 : 1));
      if (cx > max) cx = max;
      if (cx < 0) cx = 0;
    }
    function render() {
      if (cy < top) top = cy;
      if (cy >= top + ROWS) top = cy - ROWS + 1;
      pre.textContent = '';
      for (var row = 0; row < ROWS; row++) {
        var li = top + row;
        if (li < buf.length) {
          var line = buf[li].slice(0, COLS);
          if (li === cy && mode !== 'cmd') {
            var cxs = Math.min(cx, Math.max(0, line.length));
            pre.appendChild(document.createTextNode(line.slice(0, cxs)));
            var cur = document.createElement('span');
            cur.className = 'vi-inv';
            cur.textContent = line.charAt(cxs) || ' ';
            pre.appendChild(cur);
            pre.appendChild(document.createTextNode(line.slice(cxs + 1) + '\n'));
          } else {
            pre.appendChild(document.createTextNode(line + '\n'));
          }
        } else {
          var tilde = document.createElement('span');
          tilde.className = 'vi-tilde';
          tilde.textContent = '~';
          pre.appendChild(tilde);
          pre.appendChild(document.createTextNode('\n'));
        }
      }
      // status line
      if (mode === 'cmd') {
        pre.appendChild(document.createTextNode(cmdKind + cmdline));
        var cur2 = document.createElement('span');
        cur2.className = 'vi-inv';
        cur2.textContent = ' ';
        pre.appendChild(cur2);
      } else {
        var left = message || (mode === 'insert' ? '-- INSERT --' : '');
        var right = (cy + 1) + ',' + (cx + 1) + '  ' +
          (buf.length <= ROWS ? 'All' : top === 0 ? 'Top' : top + ROWS >= buf.length ? 'Bot' : Math.floor(top * 100 / (buf.length - ROWS)) + '%');
        var gap = Math.max(1, COLS - left.length - right.length - 1);
        pre.appendChild(document.createTextNode(left + ' '.repeat(gap) + right));
      }
    }
    function quit(code) {
      document.removeEventListener('keydown', keyHandler, true);
      if (vOverlay.parentNode) vOverlay.parentNode.removeChild(vOverlay);
      if (processes[pid]) delete processes[pid];
      if (foregroundPid === pid) foregroundPid = null;
      lastExit = code;
      enableTerminalInput();
      updatePrompt();
      scrollToBottom();
      if (cont) cont();
    }
    function save(target, thenQuit, force) {
      var dest = target ? normPath(target) : path;
      if (!dest) { message = 'No current filename'; return false; }
      var text = buf.join('\n') + '\n';
      var w = writeFile(dest, text);
      if (w.error) { message = "'" + (target || fileArg) + "' " + w.error; return false; }
      if (w.warn) { message = 'write error: ' + w.warn; return false; }
      if (!path) { path = dest; fileArg = target; }
      modified = false;
      message = "'" + (target || fileArg || dest) + "' " + buf.length + 'L, ' + text.length + 'C';
      if (thenQuit) quit(0);
      return true;
    }
    function execEx(cmd) {
      cmd = cmd.trim();
      if (cmd === '') return;
      if (/^\d+$/.test(cmd)) { cy = Math.min(buf.length - 1, Math.max(0, parseInt(cmd, 10) - 1)); cx = 0; return; }
      var m = /^w(q)?(!)?(?:\s+(.+))?$/.exec(cmd);
      if (m) { save(m[3] || null, !!m[1]); return; }
      if (cmd === 'x') { if (modified) save(null, true); else quit(0); return; }
      if (cmd === 'q') {
        if (modified) { message = 'No write since last change (:q! overrides)'; return; }
        quit(0);
        return;
      }
      if (cmd === 'q!') { quit(0); return; }
      if (cmd === 'set nu' || cmd === 'set number' || cmd.slice(0, 4) === 'set ') { message = ''; return; }
      message = ':' + cmd + ': No such command';
    }
    function doSearch(backwards) {
      if (!lastSearch) { message = 'No previous search'; return; }
      var re;
      try { re = new RegExp(lastSearch); } catch (e) { re = new RegExp(lastSearch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); }
      var n = buf.length;
      for (var step = 1; step <= n; step++) {
        var li = backwards ? (cy - step + n * 2) % n : (cy + step) % n;
        var mm = re.exec(buf[li]);
        if (mm) { cy = li; cx = mm.index; message = ''; return; }
      }
      message = 'Pattern not found: ' + lastSearch;
    }
    function wordFwd() {
      var line = buf[cy];
      var i = cx;
      while (i < line.length && /\S/.test(line.charAt(i))) i++;
      while (i < line.length && /\s/.test(line.charAt(i))) i++;
      if (i >= line.length && cy < buf.length - 1) { cy++; cx = 0; }
      else cx = i;
    }
    function wordBack() {
      if (cx === 0) {
        if (cy > 0) { cy--; cx = Math.max(0, buf[cy].length - 1); }
        return;
      }
      var line = buf[cy];
      var i = cx - 1;
      while (i > 0 && /\s/.test(line.charAt(i))) i--;
      while (i > 0 && /\S/.test(line.charAt(i - 1))) i--;
      cx = i;
    }

    function keyHandler(e) {
      if (e.metaKey || (e.ctrlKey && e.key !== 'c')) return;   // keep browser shortcuts
      var key = e.key;
      if (key === 'Shift' || key === 'Control' || key === 'Alt' || key === 'CapsLock') return;
      e.preventDefault();
      e.stopPropagation();

      if (e.ctrlKey && key === 'c') {
        if (mode === 'insert') { mode = 'normal'; clampCursor(false); }
        else message = 'Type :q<Enter> to exit vi (or :q! to discard changes)';
        pending = '';
        render();
        return;
      }

      if (mode === 'cmd') {
        if (key === 'Enter') {
          mode = 'normal';
          var c = cmdline;
          cmdline = '';
          if (cmdKind === ':') execEx(c);
          else if (c !== '') { lastSearch = c; cy0Search(); }
          else doSearch(false);
          clampCursor(false);
        } else if (key === 'Escape') { mode = 'normal'; cmdline = ''; }
        else if (key === 'Backspace') {
          if (cmdline === '') mode = 'normal';
          else cmdline = cmdline.slice(0, -1);
        } else if (key.length === 1) cmdline += key;
        render();
        return;
      }
      function cy0Search() { var save = cy; doSearch(false); if (message && message.indexOf('Pattern') === 0) cy = save; }

      if (mode === 'insert') {
        if (key === 'Escape') { mode = 'normal'; cx = Math.max(0, cx - 1); clampCursor(false); }
        else if (key === 'Enter') {
          var lineI = buf[cy];
          buf.splice(cy, 1, lineI.slice(0, cx), lineI.slice(cx));
          cy++; cx = 0;
        } else if (key === 'Backspace') {
          if (cx > 0) { buf[cy] = buf[cy].slice(0, cx - 1) + buf[cy].slice(cx); cx--; }
          else if (cy > 0) {
            cx = buf[cy - 1].length;
            buf.splice(cy - 1, 2, buf[cy - 1] + buf[cy]);
            cy--;
          }
        } else if (key === 'Tab') { buf[cy] = buf[cy].slice(0, cx) + '\t' + buf[cy].slice(cx); cx++; }
        else if (key === 'ArrowLeft') { if (cx > 0) cx--; }
        else if (key === 'ArrowRight') { if (cx < buf[cy].length) cx++; }
        else if (key === 'ArrowUp') { if (cy > 0) { cy--; clampCursor(true); } }
        else if (key === 'ArrowDown') { if (cy < buf.length - 1) { cy++; clampCursor(true); } }
        else if (key.length === 1) {
          buf[cy] = buf[cy].slice(0, cx) + key + buf[cy].slice(cx);
          cx++;
          modified = true;
        }
        render();
        return;
      }

      // ── normal mode ──
      message = '';
      if (pending === 'r') {
        pending = '';
        if (key.length === 1 && buf[cy].length) {
          snapshot();
          buf[cy] = buf[cy].slice(0, cx) + key + buf[cy].slice(cx + 1);
        }
        render();
        return;
      }
      if (pending === 'g') {
        pending = '';
        if (key === 'g') { cy = 0; cx = 0; }
        render();
        return;
      }
      if (pending === 'd') {
        pending = '';
        if (key === 'd') {
          snapshot();
          yankBuf = { lines: [buf[cy]] };
          buf.splice(cy, 1);
          if (!buf.length) buf = [''];
          clampCursor(false);
        } else if (key === 'w') {
          snapshot();
          var lw = buf[cy], iw = cx;
          while (iw < lw.length && /\S/.test(lw.charAt(iw))) iw++;
          while (iw < lw.length && /\s/.test(lw.charAt(iw))) iw++;
          buf[cy] = lw.slice(0, cx) + lw.slice(iw);
          clampCursor(false);
        }
        render();
        return;
      }
      if (pending === 'y') {
        pending = '';
        if (key === 'y') { yankBuf = { lines: [buf[cy]] }; message = '1 line yanked'; }
        render();
        return;
      }
      if (pending === 'Z') {
        pending = '';
        if (key === 'Z') { if (modified) save(null, true); else quit(0); return; }
        render();
        return;
      }

      switch (key) {
        case 'h': case 'ArrowLeft': if (cx > 0) cx--; break;
        case 'l': case 'ArrowRight': cx++; clampCursor(false); break;
        case 'j': case 'ArrowDown': if (cy < buf.length - 1) cy++; clampCursor(false); break;
        case 'k': case 'ArrowUp': if (cy > 0) cy--; clampCursor(false); break;
        case '0': case 'Home': cx = 0; break;
        case '$': case 'End': cx = Math.max(0, buf[cy].length - 1); break;
        case '^': { var mnb = /\S/.exec(buf[cy]); cx = mnb ? mnb.index : 0; break; }
        case 'w': wordFwd(); clampCursor(false); break;
        case 'b': wordBack(); break;
        case 'G': cy = buf.length - 1; cx = 0; break;
        case 'g': pending = 'g'; break;
        case 'x':
          if (buf[cy].length) {
            snapshot();
            buf[cy] = buf[cy].slice(0, cx) + buf[cy].slice(cx + 1);
            clampCursor(false);
          }
          break;
        case 'd': pending = 'd'; break;
        case 'y': pending = 'y'; break;
        case 'r': pending = 'r'; break;
        case 'Z': pending = 'Z'; break;
        case 'p':
          if (yankBuf) {
            snapshot();
            for (var yp = 0; yp < yankBuf.lines.length; yp++) buf.splice(cy + 1 + yp, 0, yankBuf.lines[yp]);
            cy++; cx = 0;
          }
          break;
        case 'P':
          if (yankBuf) {
            snapshot();
            for (var yp2 = 0; yp2 < yankBuf.lines.length; yp2++) buf.splice(cy + yp2, 0, yankBuf.lines[yp2]);
            cx = 0;
          }
          break;
        case 'u': {
          var st = undoStack.pop();
          if (st) { buf = st.buf; cy = st.cy; cx = st.cx; clampCursor(false); message = 'undo'; }
          else message = 'Already at oldest change';
          break;
        }
        case 'i': pushUndo(); mode = 'insert'; break;
        case 'I': { var mI = /\S/.exec(buf[cy]); cx = mI ? mI.index : 0; pushUndo(); mode = 'insert'; break; }
        case 'a': cx = Math.min(buf[cy].length, cx + 1); pushUndo(); mode = 'insert'; break;
        case 'A': cx = buf[cy].length; pushUndo(); mode = 'insert'; break;
        case 'o': snapshot(); buf.splice(cy + 1, 0, ''); cy++; cx = 0; mode = 'insert'; break;
        case 'O': snapshot(); buf.splice(cy, 0, ''); cx = 0; mode = 'insert'; break;
        case ':': mode = 'cmd'; cmdKind = ':'; cmdline = ''; break;
        case '/': mode = 'cmd'; cmdKind = '/'; cmdline = ''; break;
        case 'n': doSearch(false); break;
        case 'N': doSearch(true); break;
        case 'PageDown': cy = Math.min(buf.length - 1, cy + ROWS); clampCursor(false); break;
        case 'PageUp': cy = Math.max(0, cy - ROWS); clampCursor(false); break;
        default: break;
      }
      render();
    }

    document.addEventListener('keydown', keyHandler, true);
    render();
    return 'async';
  }

  function execute(line) {
    var trimmed = line.trim();
    if (!trimmed) return;
    history.push(trimmed);
    historyIndex = history.length;
    persistHistory();
    runCommandLine(trimmed);
  }

  // Boot the filesystem (base image + persisted overlay from localStorage)
  bootFS();

  // Build input line
  var inputLine = document.createElement('div');
  inputLine.id = 'input-line';
  var promptSpan = document.createElement('span');
  promptSpan.appendChild(buildPrompt().cloneNode(true));
  var input = document.createElement('input');
  input.id = 'input';
  input.type = 'text';
  input.autocomplete = 'off';
  input.autocapitalize = 'off';
  input.spellcheck = false;
  var typed = document.createElement('span');
  typed.id = 'typed';
  var cursor = document.createElement('span');
  cursor.id = 'cursor';
  inputLine.appendChild(promptSpan);
  inputLine.appendChild(input);
  inputLine.appendChild(typed);
  inputLine.appendChild(cursor);

  // Append input line first so addLine can insertBefore it
  terminal.appendChild(inputLine);

  // Welcome banner
  var now = new Date();
  var loginDate = new Date(now.getTime() - 300000);
  addLine('Last login: ' + formatDate(loginDate) + ' from 192.168.1.42');
  addLine('');
  addLine(bbBanner());
  addLine("Enter 'help' for a list of built-in commands.");
  addLine('');

  function updatePrompt() {
    promptSpan.textContent = '';
    promptSpan.appendChild(buildPrompt());
  }

  function syncTyped() {
    typed.textContent = input.value;
  }

  function getCompletableCommands() {
    var names = Object.keys(builtins).concat(Object.keys(applets));
    var dirs = pathDirs();
    for (var i = 0; i < dirs.length; i++) {
      var dir = fs[dirs[i]];
      if (dir && dir.type === 'dir' && dir.children) {
        for (var j = 0; j < dir.children.length; j++) {
          var child = fs[dirs[i] + '/' + dir.children[j]];
          if (child && child.executable && names.indexOf(dir.children[j]) === -1) names.push(dir.children[j]);
        }
      }
    }
    return names.sort();
  }

  function tabComplete(value) {
    var parts = value.split(/\s+/);
    var isFirst = parts.length <= 1;
    var partial = parts[parts.length - 1] || '';

    if (isFirst) {
      var cmdNames = getCompletableCommands();
      var matches = cmdNames.filter(function(c) { return c.startsWith(partial); });
      return { matches: matches, prefix: partial, isPath: false };
    }

    // Complete file/dir names
    var dirPath, namePrefix;
    var lastSlash = partial.lastIndexOf('/');
    if (lastSlash !== -1) {
      var dirPart = partial.substring(0, lastSlash) || '/';
      dirPath = resolvePath(dirPart);
      namePrefix = partial.substring(lastSlash + 1);
    } else {
      dirPath = cwd;
      namePrefix = partial;
    }

    var dir = fs[dirPath];
    if (!dir || dir.type !== 'dir' || !canRead(dirPath)) return { matches: [], prefix: partial, isPath: true };

    var matches = dir.children.filter(function(c) { return c.startsWith(namePrefix); });
    return { matches: matches, prefix: namePrefix, isPath: true, dirPath: dirPath, lastSlash: lastSlash, partial: partial };
  }

  function applyCompletion(value, result) {
    if (result.matches.length === 0) return value;
    var parts = value.split(/\s+/);

    var completed;
    if (result.matches.length === 1) {
      completed = result.matches[0];
      // Add trailing slash for directories, space for files/commands
      if (result.isPath) {
        var fullPath = (result.dirPath === '/' ? '' : result.dirPath) + '/' + completed;
        var entry = fs[fullPath];
        if (entry && entry.type === 'dir') completed += '/';
        else completed += ' ';
      } else {
        completed += ' ';
      }
    } else {
      // Fill common prefix
      var common = result.matches[0];
      for (var i = 1; i < result.matches.length; i++) {
        while (result.matches[i].indexOf(common) !== 0) {
          common = common.substring(0, common.length - 1);
        }
      }
      completed = common;
    }

    if (result.isPath && result.lastSlash !== -1) {
      completed = result.partial.substring(0, result.lastSlash + 1) + completed;
    }

    parts[parts.length - 1] = completed;
    return parts.join(' ');
  }

  terminal.addEventListener('click', function() { input.focus(); });

  input.addEventListener('input', syncTyped);

  input.addEventListener('keydown', function(e) {
    // Ctrl+C: kill foreground process or cancel input
    if (e.key === 'c' && e.ctrlKey) {
      e.preventDefault();
      if (foregroundPid !== null) {
        killProcess(foregroundPid);
        addLine('^C');
        scrollToBottom();
      } else {
        addCommandLine(input.value + '^C');
        input.value = '';
        syncTyped();
        historyIndex = history.length;
        scrollToBottom();
      }
      return;
    }
    // Block all other input while foreground process is running
    if (foregroundPid !== null) { e.preventDefault(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      var val = input.value;
      addCommandLine(val);
      input.value = '';
      syncTyped();
      reportCompletedJobs();
      execute(val);
      updatePrompt();
      scrollToBottom();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIndex > 0) { historyIndex--; input.value = history[historyIndex]; syncTyped(); }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex < history.length - 1) { historyIndex++; input.value = history[historyIndex]; syncTyped(); }
      else { historyIndex = history.length; input.value = ''; syncTyped(); }
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      clearTerminal();
      scrollToBottom();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var result = tabComplete(input.value);
      if (result.matches.length === 1) {
        input.value = applyCompletion(input.value, result);
        syncTyped();
      } else if (result.matches.length > 1) {
        // Show matches and fill common prefix
        addCommandLine(input.value);
        addLine(result.matches.join('  '));
        input.value = applyCompletion(input.value, result);
        syncTyped();
        scrollToBottom();
      }
    }
  });

  input.focus();
  window.addEventListener('focus', function() { input.focus(); });
})();
</script>
</body>
</html>

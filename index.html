<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest@securit:~$</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0a0a; color: #d4d4d4; font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', monospace; font-size: 14px; overflow: hidden; }
#terminal { height: 100%; padding: 12px; overflow-y: auto; cursor: text; }
#terminal::-webkit-scrollbar { width: 8px; }
#terminal::-webkit-scrollbar-track { background: #1a1a1a; }
#terminal::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
.line { white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
.prompt-user { color: #57c457; }
.prompt-sep { color: #d4d4d4; }

#input { position: fixed; left: -9999px; top: 0; opacity: 0; }

#cursor { display: inline-block; width: 8px; height: 1.2em; background: #d4d4d4; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
@keyframes blink { 50% { opacity: 0; } }
#sl-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0a; z-index:2000; overflow:hidden; }

.x11-titlebar { display: flex; align-items: center; height: 24px; background: linear-gradient(to bottom, #c8c8c8, #a0a0a0); border-bottom: 2px groove #888; padding: 0 3px; cursor: default; user-select: none; -webkit-user-select: none; flex-shrink: 0; }
.x11-title { flex: 1; text-align: center; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; font-weight: bold; color: #000; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border: 1px inset #999; background: #b0b0b0; margin: 2px 4px; line-height: 18px; }
.x11-btn { width: 18px; height: 18px; background: #b4b4b4; border: 2px outset #d8d8d8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 11px; font-weight: bold; color: #000; padding: 0; line-height: 1; }

</style>
</head>
<body>
<div id="terminal"></div>
<script>
(function() {
  'use strict';

  // ── BusyBox emulation: environment & persistent filesystem ──────────────
  // The shell emulates `busybox ash` (BusyBox v1.37.0) with a large subset of
  // applets. Every change the visitor makes (vi, cp, rm, mkdir, redirections,
  // ...) is recorded in an overlay persisted to localStorage, so the browser
  // acts as the machine's disk and survives reloads. `fsreset -f` reformats.
  var BB_VERSION = '1.37.0';
  var BB_BUILD = '2026-06-06 12:00:00 UTC';
  var HOME = '/home/guest';
  var env = {
    HOME: HOME, USER: 'guest', LOGNAME: 'guest', SHELL: '/bin/sh',
    TERM: 'xterm-256color', HOSTNAME: 'securit',
    PATH: '/usr/bin:/usr/sbin:/bin:/sbin',
    PWD: HOME, OLDPWD: HOME, EDITOR: 'vi', LANG: 'C.UTF-8'
  };
  var lastExit = 0;
  var BOOT_TIME = Date.now();
  var BASE_MTIME = new Date(2026, 2, 1, 12, 0, 0).getTime();

  function dirEntry(children, extra) {
    var e = { type: 'dir', children: children || [], owner: 'root', group: 'root', mode: 'drwxr-xr-x', mtime: BASE_MTIME };
    if (extra) for (var k in extra) e[k] = extra[k];
    return e;
  }
  function fileEntry(content, extra) {
    var e = { type: 'file', content: content, owner: 'root', group: 'root', mode: '-rw-r--r--', mtime: BASE_MTIME };
    if (extra) for (var k in extra) e[k] = extra[k];
    return e;
  }
  function devEntry(kind, mode) {
    return { type: 'file', content: '', dev: kind, owner: 'root', group: 'root', mode: mode || 'crw-rw-rw-', mtime: BASE_MTIME };
  }
  function procEntry(kind) {
    return { type: 'file', content: '', proc: kind, owner: 'root', group: 'root', mode: '-r--r--r--', mtime: BASE_MTIME };
  }

  function buildBaseFS() {
    return {
      '/': dirEntry(['bin', 'dev', 'etc', 'home', 'proc', 'root', 'sbin', 'tmp', 'usr', 'var']),
      '/bin': dirEntry([]),   // populated with busybox applet links at boot
      '/sbin': dirEntry([]),
      '/bin/busybox': fileEntry('', { executable: true, mode: '-rwxr-xr-x' }),
      '/dev': dirEntry(['null', 'random', 'tty', 'urandom', 'vda1', 'zero']),
      '/dev/null': devEntry('null'),
      '/dev/zero': devEntry('zero'),
      '/dev/random': devEntry('random'),
      '/dev/urandom': devEntry('random'),
      '/dev/tty': devEntry('tty'),
      '/dev/vda1': devEntry('disk', 'brw-rw----'),
      '/etc': dirEntry(['group', 'hostname', 'hosts', 'motd', 'os-release', 'passwd', 'profile', 'resolv.conf', 'shadow']),
      '/etc/hostname': fileEntry('securit\n'),
      '/etc/hosts': fileEntry('127.0.0.1\tlocalhost\n127.0.1.1\tsecurit securit.se\n\n::1\tlocalhost ip6-localhost ip6-loopback\n'),
      '/etc/motd': fileEntry('Welcome to securit.se\n\nThis system runs BusyBox and your browser is its disk: everything you\nchange (vi, cp, rm, mkdir, >redirects, ...) is stored locally and\nsurvives reloads. Type `help` for built-ins, `busybox` for applets,\nand `fsreset -f` to reformat the disk back to factory state.\n'),
      '/etc/os-release': fileEntry('NAME="Securit Linux"\nVERSION="26.06"\nID=securit\nPRETTY_NAME="Securit Linux 26.06 (BusyBox v' + BB_VERSION + ')"\nHOME_URL="https://securit.se/"\n'),
      '/etc/passwd': fileEntry('root:x:0:0:root:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/false\nsshd:x:100:65534::/run/sshd:/bin/false\nguest:x:1000:1000:guest:/home/guest:/bin/sh\n'),
      '/etc/group': fileEntry('root:x:0:\ndaemon:x:1:\ndisk:x:6:\nguest:x:1000:\n'),
      '/etc/shadow': fileEntry('root:$6$rounds=656000$REDACTED:20200:0:99999:7:::\n', { mode: '-rw-------' }),
      '/etc/profile': fileEntry('# /etc/profile: system-wide profile for the Bourne shells\n\nexport PATH="/usr/bin:/usr/sbin:/bin:/sbin"\nif [ "$PS1" ]; then\n  cat /etc/motd 2>/dev/null\nfi\n'),
      '/etc/resolv.conf': fileEntry('nameserver 192.168.1.1\nsearch lan\n'),
      '/home': dirEntry(['guest']),
      '/home/guest': dirEntry(['.profile', 'Documents', 'contact.txt', 'projects.txt'], { owner: 'guest', group: 'guest' }),
      '/home/guest/.profile': fileEntry("# ~/.profile: executed by the ash shell at login.\n\nexport PS1='\\u@\\h:\\w\\$ '\nexport EDITOR=vi\n", { owner: 'guest', group: 'guest' }),
      '/home/guest/contact.txt': fileEntry('johan@ryberg.se\n', { owner: 'guest', group: 'guest' }),
      '/home/guest/projects.txt': fileEntry('Projects\n========\n\ngojinja\n-------\nA Go implementation of the Jinja2 template engine.\nFull support for Jinja2 syntax, designed for embedding in Go applications.\n\n  Source:  https://github.com/jryberg/gojinja\n  Docs:    https://securit.se/gojinja/stable/\n', { owner: 'guest', group: 'guest' }),
      '/home/guest/Documents': dirEntry([], { owner: 'guest', group: 'guest' }),
      '/proc': dirEntry(['cpuinfo', 'meminfo', 'uptime', 'version'], { mode: 'dr-xr-xr-x' }),
      '/proc/cpuinfo': procEntry('cpuinfo'),
      '/proc/meminfo': procEntry('meminfo'),
      '/proc/uptime': procEntry('uptime'),
      '/proc/version': procEntry('version'),
      '/root': dirEntry([], { mode: 'drwx------' }),
      '/tmp': dirEntry([], { mode: 'drwxrwxrwt' }),
      '/usr': dirEntry(['bin', 'sbin']),
      '/usr/bin': dirEntry(['clock', 'deerhunt', 'floppy', 'floppyhunt', 'lemmings']),
      '/usr/bin/clock': { type: 'file', content: '', executable: true, xapp: true, src: 'garden-clock.html', windowTitle: 'The Garden Clock', owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/bin/deerhunt': { type: 'file', content: '', executable: true, xapp: true, src: 'deerhunt.html', windowTitle: 'Deer Hunt', winW: 1024, winH: 720, owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/bin/floppy': { type: 'file', content: '', executable: true, xapp: true, src: 'floppy.html', windowTitle: 'Floppy', owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/bin/floppyhunt': { type: 'file', content: '', executable: true, xapp: true, src: 'floppyhunt.html', windowTitle: 'Floppy Hunt', winW: 960, winH: 720, owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/bin/lemmings': { type: 'file', content: '', executable: true, xapp: true, src: 'lemmings.html', windowTitle: 'Lemmings', winW: 640, winH: 480, owner: 'root', group: 'root', mode: '-rwxr-xr-x', mtime: BASE_MTIME },
      '/usr/sbin': dirEntry([]),
      '/var': dirEntry(['log']),
      '/var/log': dirEntry(['messages']),
      '/var/log/messages': fileEntry('Mar  1 12:00:01 securit syslogd started: BusyBox v' + BB_VERSION + '\nMar  1 12:00:01 securit kernel: EXT4-fs (vda1): mounted filesystem with ordered data mode\nMar  1 12:00:02 securit kernel: random: crng init done\nMar  1 12:00:03 securit sshd[204]: Server listening on 0.0.0.0 port 22.\n')
    };
  }

  var fs = null;   // populated by bootFS()

  // Persistence: the overlay maps absolute path -> entry (or null = deleted).
  var FS_KEY = 'securit.fs.v1';
  var HIST_KEY = 'securit.hist.v1';
  var overlay = {};
  var storageOK = true;

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function persistFS() {
    try { localStorage.setItem(FS_KEY, JSON.stringify(overlay)); storageOK = true; }
    catch (e) { storageOK = false; }
    return storageOK;
  }
  function markDirty(path) {
    overlay[path] = fs[path] || null;
  }
  function bootFS() {
    fs = buildBaseFS();
    registerAppletBinaries();
    var saved = loadJSON(FS_KEY);
    if (saved && typeof saved === 'object') {
      overlay = saved;
      Object.keys(overlay).forEach(function(p) {
        if (overlay[p] === null) delete fs[p];
        else fs[p] = overlay[p];
      });
    }
  }

  // Path helpers
  function normPath(p, base) {
    if (!p) return base || cwd;
    if (p === '~') p = env.HOME;
    else if (p.slice(0, 2) === '~/') p = env.HOME + p.slice(1);
    if (p.charAt(0) !== '/') p = (base || cwd) + '/' + p;
    var parts = p.split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i];
      if (!s || s === '.') continue;
      if (s === '..') out.pop();
      else out.push(s);
    }
    return '/' + out.join('/');
  }
  function parentOf(p) { var i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); }
  function baseName(p) { if (p === '/') return '/'; return p.slice(p.lastIndexOf('/') + 1); }
  function cloneEntry(e) { return JSON.parse(JSON.stringify(e)); }

  // Permissions: guest may read anything with the others-read bit (or own
  // files), and may only write below $HOME and /tmp.
  function canRead(path) {
    var e = fs[path];
    if (!e) return false;
    if (e.owner === 'guest') return true;
    return (e.mode || '').charAt(7) === 'r';
  }
  function canWritePath(path) {
    if (path === '/dev/null') return true;
    return path === HOME || path.indexOf(HOME + '/') === 0 || path === '/tmp' || path.indexOf('/tmp/') === 0;
  }

  function devRead(e) {
    if (e.dev === 'random') {
      var s = '';
      for (var i = 0; i < 192; i++) s += String.fromCharCode(33 + Math.floor(Math.random() * 94));
      return s + '\n';
    }
    return '';
  }
  function procRead(kind) {
    if (kind === 'uptime') {
      var up = (Date.now() - BOOT_TIME) / 1000 + 4242;
      return up.toFixed(2) + ' ' + (up * 0.97).toFixed(2) + '\n';
    }
    if (kind === 'version') {
      return 'Linux version 6.1.0-37-amd64 (builder@securit) (gcc (Debian 12.2.0-14) 12.2.0) #1 SMP PREEMPT_DYNAMIC Debian 6.1.140-1 (2025-05-22)\n';
    }
    if (kind === 'meminfo') {
      return 'MemTotal:        2013452 kB\nMemFree:         1524188 kB\nMemAvailable:    1730040 kB\nBuffers:           38124 kB\nCached:           281550 kB\nSwapTotal:             0 kB\nSwapFree:              0 kB\n';
    }
    if (kind === 'cpuinfo') {
      var n = (navigator.hardwareConcurrency || 2), s = '';
      for (var i = 0; i < n; i++) {
        s += 'processor\t: ' + i + '\nvendor_id\t: GenuineIntel\nmodel name\t: Intel(R) Xeon(R) CPU @ 2.20GHz\ncpu MHz\t\t: 2199.998\ncache size\t: 56320 KB\nbogomips\t: 4399.99\n\n';
      }
      return s;
    }
    return '';
  }

  // File primitives used by the applets. All return {ok:...} or {error:'...'}.
  function readFile(path) {
    var e = fs[path];
    if (!e) return { error: 'No such file or directory' };
    if (e.type === 'dir') return { error: 'Is a directory' };
    if (!canRead(path)) return { error: 'Permission denied' };
    if (e.dev) return { content: devRead(e) };
    if (e.proc) return { content: procRead(e.proc) };
    return { content: e.content };
  }
  function writeFile(path, content, opts) {
    opts = opts || {};
    var e = fs[path];
    if (e && (e.dev || path === '/dev/null')) return { ok: true };   // devices discard
    if (e && e.type === 'dir') return { error: 'Is a directory' };
    if (!canWritePath(path)) return { error: 'Permission denied' };
    if (!e) {
      var pp = parentOf(path), parent = fs[pp];
      if (!parent) return { error: 'No such file or directory' };
      if (parent.type !== 'dir') return { error: 'Not a directory' };
      e = { type: 'file', content: '', owner: 'guest', group: 'guest', mode: '-rw-r--r--', mtime: Date.now() };
      fs[path] = e;
      if (parent.children.indexOf(baseName(path)) < 0) parent.children.push(baseName(path));
      markDirty(pp);
    }
    e.content = opts.append ? e.content + content : content;
    e.mtime = Date.now();
    markDirty(path);
    if (!persistFS()) return { ok: true, warn: 'No space left on device' };
    return { ok: true };
  }
  function mkdirNode(path) {
    if (fs[path]) return { error: 'File exists' };
    var pp = parentOf(path), parent = fs[pp];
    if (!parent || parent.type !== 'dir') return { error: parent ? 'Not a directory' : 'No such file or directory' };
    if (!canWritePath(path)) return { error: 'Permission denied' };
    fs[path] = { type: 'dir', children: [], owner: 'guest', group: 'guest', mode: 'drwxr-xr-x', mtime: Date.now() };
    parent.children.push(baseName(path));
    markDirty(pp);
    markDirty(path);
    persistFS();
    return { ok: true };
  }
  function removeNode(path) {
    var e = fs[path];
    if (!e) return { error: 'No such file or directory' };
    if (!canWritePath(path)) return { error: 'Permission denied' };
    Object.keys(fs).forEach(function(p) {
      if (p === path || p.indexOf(path + '/') === 0) { delete fs[p]; overlay[p] = null; }
    });
    var pp = parentOf(path), parent = fs[pp];
    if (parent && parent.children) {
      var i = parent.children.indexOf(baseName(path));
      if (i >= 0) parent.children.splice(i, 1);
      markDirty(pp);
    }
    persistFS();
    return { ok: true };
  }

  function pathDirs() { return env.PATH.split(':').filter(Boolean); }

  var cwd = HOME;
  var prevDir = cwd;

  // Remote login sessions (ssh). Empty = the local guest@securit shell. Each
  // frame overrides the prompt identity and remembers what to restore on exit.
  var sessions = [];
  function curUser() { return sessions.length ? sessions[sessions.length - 1].user : 'guest'; }
  function curHost() { return sessions.length ? sessions[sessions.length - 1].host : 'securit'; }

  var history = loadJSON(HIST_KEY) || [];
  var historyIndex = history.length;
  function persistHistory() {
    if (history.length > 500) history = history.slice(history.length - 500);
    try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) { /* full disk */ }
  }
  var terminal = document.getElementById('terminal');

  // Process management (Linux-realistic PIDs)
  var bootProcs = [
    { pid: 1, user: 'root', cpu: '0.0', mem: '0.2', vsz: 169936, rss: 13284, tty: '?', stat: 'Ss', command: '/sbin/init' },
    { pid: 2, user: 'root', cpu: '0.0', mem: '0.0', vsz: 0, rss: 0, tty: '?', stat: 'S', command: '[kthreadd]' },
    { pid: 87, user: 'root', cpu: '0.0', mem: '0.1', vsz: 31608, rss: 5764, tty: '?', stat: 'Ss', command: '/lib/systemd/systemd-journald' },
    { pid: 112, user: 'root', cpu: '0.0', mem: '0.1', vsz: 22060, rss: 3428, tty: '?', stat: 'Ss', command: '/lib/systemd/systemd-udevd' },
    { pid: 198, user: 'root', cpu: '0.0', mem: '0.0', vsz: 6816, rss: 2964, tty: '?', stat: 'Ss', command: 'cron -f' },
    { pid: 204, user: 'root', cpu: '0.0', mem: '0.1', vsz: 15420, rss: 7060, tty: '?', stat: 'Ss', command: '/usr/sbin/sshd -D' },
    { pid: 312, user: 'root', cpu: '0.0', mem: '0.1', vsz: 17180, rss: 7416, tty: '?', stat: 'Ss', command: 'sshd: guest [priv]' },
    { pid: 354, user: 'guest', cpu: '0.0', mem: '0.1', vsz: 17180, rss: 4520, tty: '?', stat: 'S', command: 'sshd: guest@pts/0' }
  ];
  var shellPid = 355;
  var nextPid = 356;
  var processes = {};
  var jobs = {};
  var nextJobId = 1;
  var foregroundPid = null;
  var completedJobs = [];

  function escapeHTML(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function resolvePath(p) {
    if (p === '-') return prevDir;
    return normPath(p);
  }

  function getDisplayPath() {
    if (cwd === env.HOME) return '~';
    if (cwd.indexOf(env.HOME + '/') === 0) return '~' + cwd.slice(env.HOME.length);
    return cwd;
  }

  function buildPrompt() {
    var span = document.createElement('span');
    var user = document.createElement('span');
    user.className = 'prompt-user';
    user.textContent = curUser() + '@' + curHost();
    var sep = document.createElement('span');
    sep.className = 'prompt-sep';
    sep.textContent = ':';
    var path = document.createElement('span');
    path.className = 'prompt-path';
    path.textContent = getDisplayPath();
    var dollar = document.createElement('span');
    dollar.className = 'prompt-dollar';
    dollar.textContent = '$ ';
    span.appendChild(user);
    span.appendChild(sep);
    span.appendChild(path);
    span.appendChild(dollar);
    return span;
  }

  // Terminal output with basic ANSI SGR (color/bold) support, so applets can
  // colorize like real busybox tools (ls --color, grep --color, ...).
  var SGR_COLORS = {
    30: '#0a0a0a', 31: '#e06c75', 32: '#57c457', 33: '#d7af5f', 34: '#5f87d7', 35: '#c678dd', 36: '#56b6c2', 37: '#d4d4d4',
    90: '#6b6b6b', 91: '#ff7b86', 92: '#7ce38b', 93: '#e5c07b', 94: '#7aa2f7', 95: '#d3a4f0', 96: '#7dcfff', 97: '#ffffff'
  };
  function appendAnsiText(div, text) {
    var re = /\x1b\[([0-9;]*)m/g;
    var idx = 0, m, bold = false, color = null;
    function emit(chunk) {
      if (!chunk) return;
      if (!bold && !color) { div.appendChild(document.createTextNode(chunk)); return; }
      var span = document.createElement('span');
      if (color) span.style.color = color;
      if (bold) span.style.fontWeight = 'bold';
      span.textContent = chunk;
      div.appendChild(span);
    }
    while ((m = re.exec(text))) {
      emit(text.slice(idx, m.index));
      idx = m.index + m[0].length;
      var codes = m[1] === '' ? [0] : m[1].split(';').map(Number);
      for (var i = 0; i < codes.length; i++) {
        if (codes[i] === 0) { bold = false; color = null; }
        else if (codes[i] === 1) bold = true;
        else if (SGR_COLORS[codes[i]]) color = SGR_COLORS[codes[i]];
      }
    }
    emit(text.slice(idx));
  }
  function addLine(text) {
    var div = document.createElement('div');
    div.className = 'line';
    var s = text === undefined || text === null ? '' : String(text);
    if (s === '') div.appendChild(document.createTextNode(' '));
    else appendAnsiText(div, s);
    terminal.insertBefore(div, inputLine);
  }

  function addCommandLine(cmdText) {
    var div = document.createElement('div');
    div.className = 'line';
    div.appendChild(buildPrompt());
    var textNode = document.createTextNode(cmdText);
    div.appendChild(textNode);
    terminal.insertBefore(div, inputLine);
  }

  function scrollToBottom() {
    terminal.scrollTop = terminal.scrollHeight;
  }

  // X11 window management
  var topZIndex = 1000;

  function bringToFront(win) {
    topZIndex++;
    win.style.zIndex = topZIndex;
  }

  function makeWindowDraggable(win, handle) {
    var dragging = false, startX, startY, origLeft, origTop;
    handle.addEventListener('mousedown', function(e) {
      if (e.target.tagName === 'BUTTON') return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      origLeft = parseInt(win.style.left) || 0;
      origTop = parseInt(win.style.top) || 0;
      var iframe = win.querySelector('iframe');
      if (iframe) iframe.style.pointerEvents = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      win.style.left = (origLeft + e.clientX - startX) + 'px';
      win.style.top = (origTop + e.clientY - startY) + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        var iframe = win.querySelector('iframe');
        if (iframe) iframe.style.pointerEvents = '';
      }
    });
  }

  function createX11Window(fileMeta, pid) {
    var win = document.createElement('div');
    win.className = 'x11-window';
    win.dataset.pid = pid;
    var w = Math.min(fileMeta.winW || 640, window.innerWidth - 40);
    var h = Math.min(fileMeta.winH || 520, window.innerHeight - 40);
    var offsetX = (Math.random() - 0.5) * 60;
    var offsetY = (Math.random() - 0.5) * 60;
    win.style.width = w + 'px';
    win.style.height = h + 'px';
    win.style.left = Math.max(10, (window.innerWidth - w) / 2 + offsetX) + 'px';
    win.style.top = Math.max(10, (window.innerHeight - h) / 2 + offsetY) + 'px';

    var titlebar = document.createElement('div');
    titlebar.className = 'x11-titlebar';
    var btnMin = document.createElement('button');
    btnMin.className = 'x11-btn';
    btnMin.textContent = '_';
    btnMin.title = 'Minimize';
    var title = document.createElement('div');
    title.className = 'x11-title';
    title.textContent = fileMeta.windowTitle || 'X11 Application';
    var btnMax = document.createElement('button');
    btnMax.className = 'x11-btn';
    btnMax.textContent = '\u25a1';
    btnMax.title = 'Maximize';
    var btnClose = document.createElement('button');
    btnClose.className = 'x11-btn';
    btnClose.textContent = 'X';
    btnClose.title = 'Close';
    titlebar.appendChild(btnMin);
    titlebar.appendChild(title);
    titlebar.appendChild(btnMax);
    titlebar.appendChild(btnClose);

    var body = document.createElement('div');
    body.className = 'x11-body';
    var iframe = document.createElement('iframe');
    iframe.src = fileMeta.src;
    iframe.allow = 'pointer-lock; fullscreen; autoplay';
    body.appendChild(iframe);

    win.appendChild(titlebar);
    win.appendChild(body);
    document.body.appendChild(win);

    btnClose.addEventListener('click', function() { killProcess(pid); });
    btnMin.addEventListener('click', function() { win.style.display = 'none'; });
    var maximized = false;
    var origStyle = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
    btnMax.addEventListener('click', function() {
      if (!maximized) {
        origStyle = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
        win.style.left = '0'; win.style.top = '0'; win.style.width = '100vw'; win.style.height = '100vh';
      } else {
        win.style.width = origStyle.width; win.style.height = origStyle.height;
        win.style.left = origStyle.left; win.style.top = origStyle.top;
      }
      maximized = !maximized;
    });
    makeWindowDraggable(win, titlebar);
    win.addEventListener('mousedown', function() { bringToFront(win); });
    return win;
  }

  // Process lifecycle
  function disableTerminalInput() {
    input.disabled = true;
    cursor.style.display = 'none';
    inputLine.style.display = 'none';
  }

  function enableTerminalInput() {
    input.disabled = false;
    cursor.style.display = '';
    inputLine.style.display = '';
    input.focus();
  }

  function spawnXApp(command, fileMeta, background) {
    var pid = nextPid++;
    var proc = { pid: pid, command: command, jobId: null, windowEl: null, startTime: new Date(), status: 'running' };
    proc.windowEl = createX11Window(fileMeta, pid);
    processes[pid] = proc;
    if (background) {
      var jobId = nextJobId++;
      proc.jobId = jobId;
      jobs[jobId] = { jobId: jobId, pid: pid, command: command, status: 'running' };
      addLine('[' + jobId + '] ' + pid);
    } else {
      foregroundPid = pid;
      disableTerminalInput();
    }
  }

  function killProcess(pid) {
    var proc = processes[pid];
    if (!proc) return false;
    if (proc.intervalId) clearInterval(proc.intervalId);
    if (proc.windowEl && proc.windowEl.parentNode) proc.windowEl.parentNode.removeChild(proc.windowEl);
    if (foregroundPid === pid) {
      foregroundPid = null;
      enableTerminalInput();
      updatePrompt();
      scrollToBottom();
    }
    if (proc.jobId && jobs[proc.jobId]) {
      jobs[proc.jobId].status = 'done';
      completedJobs.push(jobs[proc.jobId]);
    }
    proc.status = 'done';
    delete processes[pid];
    if (proc.onExit) proc.onExit();
    return true;
  }

  function reportCompletedJobs() {
    while (completedJobs.length > 0) {
      var job = completedJobs.shift();
      addLine('[' + job.jobId + ']+  Done                    ' + job.command);
      delete jobs[job.jobId];
    }
  }

  // PATH resolution (for the X11 apps living in /usr/bin)
  function resolveFromPath(cmdName) {
    var dirs = pathDirs();
    for (var i = 0; i < dirs.length; i++) {
      var binPath = dirs[i] + '/' + cmdName;
      var entry = fs[binPath];
      if (entry && entry.type === 'file' && entry.executable) return { path: binPath, entry: entry };
    }
    return null;
  }

  function formatPsTime(d) {
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function formatDate(d) {
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var day = days[d.getDay()];
    var month = months[d.getMonth()];
    var date = d.getDate().toString();
    if (date.length === 1) date = ' ' + date;
    var h = d.getHours().toString().padStart(2, '0');
    var m = d.getMinutes().toString().padStart(2, '0');
    var s = d.getSeconds().toString().padStart(2, '0');
    return day + ' ' + month + ' ' + date + ' ' + h + ':' + m + ':' + s + ' ' + d.getFullYear();
  }

  // ── Shell: tokenizer ─────────────────────────────────────────────────────
  // Tokens are operators ({op:'|'}) or words: lists of {text, quote} segments
  // where quote is null (expandable), "'" (literal) or '"' (vars expand).
  function tokenize(line) {
    var toks = [], i = 0, n = line.length, cur = null;
    function seg(text, quote) {
      if (!cur) cur = { word: [] };
      cur.word.push({ text: text, quote: quote });
    }
    function flush() { if (cur) { toks.push(cur); cur = null; } }
    while (i < n) {
      var c = line[i];
      if (c === ' ' || c === '\t' || c === '\r') { flush(); i++; continue; }
      if (c === '\n') { flush(); toks.push({ op: ';' }); i++; continue; }
      if (c === '#' && !cur) { while (i < n && line[i] !== '\n') i++; continue; }
      if (c === "'") {
        var j = line.indexOf("'", i + 1);
        if (j < 0) return { error: 'syntax error: unterminated quoted string' };
        seg(line.slice(i + 1, j), "'");
        i = j + 1; continue;
      }
      if (c === '"') {
        var buf = '', k = i + 1, closed = false;
        while (k < n) {
          var d = line[k];
          if (d === '\\' && k + 1 < n && '"\\$`'.indexOf(line[k + 1]) >= 0) { buf += line[k + 1]; k += 2; continue; }
          if (d === '"') { closed = true; break; }
          buf += d; k++;
        }
        if (!closed) return { error: 'syntax error: unterminated quoted string' };
        seg(buf, '"');
        i = k + 1; continue;
      }
      if (c === '\\' && i + 1 < n) { seg(line[i + 1], "'"); i += 2; continue; }
      if (c === '&' && line[i + 1] === '&') { flush(); toks.push({ op: '&&' }); i += 2; continue; }
      if (c === '|' && line[i + 1] === '|') { flush(); toks.push({ op: '||' }); i += 2; continue; }
      if (c === '|') { flush(); toks.push({ op: '|' }); i++; continue; }
      if (c === ';') { flush(); toks.push({ op: ';' }); i++; continue; }
      if (c === '&') { flush(); toks.push({ op: '&' }); i++; continue; }
      if (c === '2' && !cur && line[i + 1] === '>') {
        if (line[i + 2] === '>') { toks.push({ op: '2>>' }); i += 3; continue; }
        if (line[i + 2] === '&' && line[i + 3] === '1') { toks.push({ op: '2>&1' }); i += 4; continue; }
        toks.push({ op: '2>' }); i += 2; continue;
      }
      if (c === '>') {
        flush();
        if (line[i + 1] === '>') { toks.push({ op: '>>' }); i += 2; } else { toks.push({ op: '>' }); i++; }
        continue;
      }
      if (c === '<') { flush(); toks.push({ op: '<' }); i++; continue; }
      var run = '';
      while (i < n) {
        var pc = line[i];
        if (pc === '$' && line[i + 1] === '(') {
          // keep $( ... ) — and $(( ... )) — intact inside the word, spaces and all
          var depth = 0, k2 = i + 1;
          while (k2 < n) {
            if (line[k2] === '(') depth++;
            else if (line[k2] === ')') { depth--; if (!depth) { k2++; break; } }
            k2++;
          }
          run += line.slice(i, k2);
          i = k2;
          continue;

  // ── Shell: parser ────────────────────────────────────────────────────────
  // Recursive descent over the token stream. Produces {stmts:[{op, node}]}
  // where op links the statement to the previous one (';', '&&' or '||') and
  // node is either {type:'pipeline', pipe:[{words,redirs}], bg} or a compound
  // node for if/for/while/until. Keywords count only in command position.
  function parseProgram(toks) {
    var pos = 0;

    function wordLiteral(word) {
      return word.length === 1 && word[0].quote === null ? word[0].text : null;
    }
    function expectWord(s) {
      var save = pos;
      while (toks[pos] && toks[pos].op === ';') pos++;
      var t = toks[pos];
      if (t && t.word && wordLiteral(t.word) === s) { pos++; return true; }
      pos = save;
      return false;
    }

    function parsePipelineNode() {
      var pipe = [];
      var cmd = { words: [], redirs: {} };
      var pendingRedir = null;
      function cmdEmpty() { return !cmd.words.length && !Object.keys(cmd.redirs).length; }
      loop:
      for (;;) {
        var t = toks[pos];
        if (!t) break;
        if (t.word) {
          if (pendingRedir) { cmd.redirs[pendingRedir] = t.word; pendingRedir = null; }
          else cmd.words.push(t.word);
          pos++;
          continue;
        }
        if (pendingRedir) return { error: "syntax error near unexpected token `" + t.op + "'" };
        switch (t.op) {
          case '>': pendingRedir = 'out'; pos++; break;
          case '>>': pendingRedir = 'append'; pos++; break;
          case '<': pendingRedir = 'in'; pos++; break;
          case '2>': pendingRedir = 'err'; pos++; break;
          case '2>>': pendingRedir = 'errAppend'; pos++; break;
          case '2>&1': cmd.redirs.errToOut = true; pos++; break;
          case '|':
            if (cmdEmpty()) return { error: "syntax error near unexpected token `|'" };
            pipe.push(cmd);
            cmd = { words: [], redirs: {} };
            pos++;
            break;
          default: break loop;
        }
      }
      if (pendingRedir) return { error: 'syntax error: expected redirection target' };
      if (!cmdEmpty()) pipe.push(cmd);
      else if (pipe.length) return { error: "syntax error near unexpected token `|'" };
      if (!pipe.length) return { error: "syntax error near unexpected token `" + (toks[pos] ? toks[pos].op : 'newline') + "'" };
      return { type: 'pipeline', pipe: pipe, bg: false };
    }

    function parseIf() {
      pos++;
      var cond = parseList(['then']);
      if (cond.error) return cond;
      if (!expectWord('then')) return { error: "syntax error: expected `then'" };
      var thenL = parseList(['elif', 'else', 'fi']);
      if (thenL.error) return thenL;
      var elifs = [], els = null;
      for (;;) {
        if (expectWord('elif')) {
          var c2 = parseList(['then']);
          if (c2.error) return c2;
          if (!expectWord('then')) return { error: "syntax error: expected `then'" };

          continue;
        }
        if (expectWord('else')) {
          var e2 = parseList(['fi']);
          if (e2.error) return e2;
          els = e2.stmts;
        }
        if (!expectWord('fi')) return { error: "syntax error: expected `fi'" };
        break;
      }
      return { type: 'if', cond: cond.stmts, then: thenL.stmts, elifs: elifs, els: els };
    }

    function parseFor() {
      pos++;

      }

      if (body.error) return body;
      if (!expectWord('done')) return { error: "syntax error: expected `done'" };

    function parseWhileUntil(until) {
      pos++;
      var cond = parseList(['do']);
      if (cond.error) return cond;
      if (!expectWord('do')) return { error: "syntax error: expected `do'" };

      if (body.error) return body;
      if (!expectWord('done')) return { error: "syntax error: expected `done'" };

      if (kw === 'while') return parseWhileUntil(false);

      }

    var prog = parseList(null);

  // Applets that take over the screen / run in real time when started from an
  // interactive prompt (standalone, without stdout redirection).
  var INTERACTIVE = { vi: true, sl: true, sleep: true, yes: true, ssh: true, ping: true };

  function registerAppletBinaries() {
    var names = Object.keys(applets).sort();
    var bin = fs['/bin'];
    for (var i = 0; i < names.length; i++) {
      var p = '/bin/' + names[i];
      if (!fs[p]) {
        fs[p] = { type: 'file', content: '', executable: true, applet: true, linkTo: 'busybox', owner: 'root', group: 'root', mode: 'lrwxrwxrwx', mtime: BASE_MTIME };
        bin.children.push(names[i]);
      }
    }
    fs['/bin/busybox'].content = '\u007fELF\u0002\u0001\u0001\u0000...busybox multi-call binary (stripped)\u0000';
    fs['/bin/busybox'].size = 1084216;
    if (bin.children.indexOf('busybox') < 0) bin.children.push('busybox');
    bin.children.sort();
  }

  // stdout sink: normally the terminal; a capture buffer during $(...)
  var captureBuf = null;
  var substDepth = 0;
  var noInteractive = 0;

  function termWrite(text) {
    if (!text) return;
    if (captureBuf !== null) { captureBuf.push(String(text)); return; }
    var lines = String(text).split('\n');
    if (lines[lines.length - 1] === '') lines.pop();
    for (var i = 0; i < lines.length; i++) addLine(lines[i]);
  }

  var substExit = null;   // exit code of the last $(...) run in this pipeline

  function captureRun(cmdline) {

  // Stable pseudo-random bytes from a seed string (no real crypto needed).
  function seededBytes(seed, n) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var out = [];
    for (var j = 0; j < n; j++) { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; out.push(h & 0xff); }
    return out;
  }

    var CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/', s = '';
    for (var i = 0; i < bytes.length; i += 3) {
      var n = (bytes[i] << 16) | ((bytes[i + 1] || 0) << 8) | (bytes[i + 2] || 0);
      s += CH[(n >> 18) & 63] + CH[(n >> 12) & 63];
      s += i + 1 < bytes.length ? CH[(n >> 6) & 63] : '';

  function parseSshArgs(args) {
    var o = { user: null, host: null, port: 22, verbose: 0, ident: null, cmd: [], want: false, opts: [] };
    for (var i = 0; i < args.length; i++) {
      var a = args[i];
      if (o.host) { o.cmd.push(a); continue; }
      if (a === '-v') { o.verbose++; continue; }
      if (a === '-vv' || a === '-vvv') { o.verbose += a.length - 1; continue; }
      if (a === '-p') { o.port = parseInt(args[++i], 10) || 22; continue; }
      if (a.slice(0, 2) === '-p' && a.length > 2) { o.port = parseInt(a.slice(2), 10) || 22; continue; }
      if (a === '-l') { o.user = args[++i]; continue; }
      if (a === '-i') { o.ident = args[++i]; continue; }
      if (a === '-o' || a === '-c' || a === '-b' || a === '-F') { i++; continue; }
      if (a === '-T' || a === '-t' || a === '-q' || a === '-N' || a === '-x' || a === '-A' || a === '-C' || a === '-4' || a === '-6') continue;
      if (a.charAt(0) === '-' && a.length > 1) continue;   // ignore unknown flags
      // first operand: [user@]host
      var at = a.indexOf('@');
      if (at >= 0) { o.user = a.slice(0, at); o.host = a.slice(at + 1); }
      else o.host = a;
    }
    if (o.host && !o.user) o.user = curUser();
    return o;
  }

  function sshVerbose(o, target, out) {
    if (!o.verbose) return;
    out('OpenSSH_9.7p1, OpenSSL 3.0.13 30 Jan 2024');
    out('debug1: Connecting to ' + o.host + ' [' + target.ip + '] port ' + o.port + '.');
    out('debug1: Connection established.');
    out('debug1: Local version string SSH-2.0-OpenSSH_9.7p1');
    out('debug1: Remote protocol version 2.0, remote software version OpenSSH_9.7p1');
    out('debug1: SSH2_MSG_KEXINIT sent');
    out('debug1: SSH2_MSG_KEXINIT received');
    out('debug1: kex: algorithm: curve25519-sha256');
    out('debug1: kex: host key algorithm: ssh-ed25519');
    out('debug1: Server host key: ssh-ed25519 ' + hostFingerprint(target.ssh.host));
    out('debug1: Host \'' + o.host + '\' is known and matches the ED25519 host key.');
    out('debug1: SSH2_MSG_NEWKEYS sent');
    out('debug1: SSH2_MSG_NEWKEYS received');
  }

  // ── ssh (interactive OpenSSH-style client) ───────────────────────────────
  function launchSsh(args, cont) {
    var o = parseSshArgs(args);

    // Failures reachable before any prompt resolve synchronously, so the outer
    // command list ('ssh bad && echo') continues normally with $? set.
    if (!o.host) {
      addLine('usage: ssh [-v] [-p port] [-i identity] [-l login_name] [user@]hostname [command]');
      lastExit = 255; return;
    }
    var target = resolveHost(o.host);
    if (!target && isIP(o.host)) { addLine('ssh: connect to host ' + o.host + ' port ' + o.port + ': Connection refused'); lastExit = 255; return; }
    if (!target) { addLine('ssh: Could not resolve hostname ' + o.host + ': Name or service not known'); lastExit = 255; return; }
    if (!target.ssh) { addLine('ssh: connect to host ' + o.host + ' port ' + o.port + ': Connection refused'); lastExit = 255; return; }

    var srv = target.ssh;
    var out = addLine;
    sshVerbose(o, target, out);
    var runCmd = o.cmd.length ? o.cmd.join(' ') : null;

    // Terminal outcomes that must resume the outer command list now.
    function finish(code) { lastExit = code; if (cont) cont(); }

    function afterAuth() {
      if (o.verbose) out('debug1: Entering interactive session.');
      if (runCmd) {
        runCommandLine(runCmd);   // ssh host command → run remotely, then close
        finish(lastExit);
        return;
      }
      // interactive login: push a session frame; logout resumes the outer list
      var frame = {
        user: o.user, host: srv.host, connectedVia: o.host,
        prevHostEnv: env.HOSTNAME, prevCwd: cwd, prevPrevDir: prevDir, cont: cont
      };
      env.HOSTNAME = srv.host;
      if (srv.motd) srv.motd.forEach(out);
      else {
        out('Linux ' + srv.host + ' 6.1.0-37-amd64 #1 SMP x86_64');
        out('');
      }
      var last = new Date(Date.now() - (600000 + Math.floor(Math.random() * 6e8)));
      out('Last login: ' + formatDate(last) + ' from ' + NET.ip);
      sessions.push(frame);
      lastExit = 0;
      updatePrompt();
      scrollToBottom();
    }

    function tryKnownHost(next) {
      if (knownHostHas(srv.host) || knownHostHas(o.host)) { next(); return; }
      var fp = hostFingerprint(srv.host);
      out('The authenticity of host \'' + o.host + ' (' + target.ip + ')\' can\'t be established.');
      out('ED25519 key fingerprint is ' + fp + '.');
      out('This key is not known by any other names.');
      promptRead('Are you sure you want to continue connecting (yes/no/[fingerprint])? ', {}, function(ans) {
        if (ans === null) { addLine(''); return finish(130); }
        ans = (ans || '').trim();
        if (ans === 'yes' || ans === fp) {
          addKnownHost(srv.host);
          addLine("Warning: Permanently added '" + o.host + "' (ED25519) to the list of known hosts.");
          next();
        } else if (ans === 'no' || ans === '') {
          addLine('Host key verification failed.');
          finish(255);
        } else {
          addLine('Please type \'yes\', \'no\' or the fingerprint: (assuming no)');
          addLine('Host key verification failed.');
          finish(255);
        }
      });
    }

    function doAuth() {
      // sshd Banner (pre-authentication), shown before any password prompt
      if (srv.banner) srv.banner.forEach(out);
      if (srv.auth === 'key') {
        if (o.verbose) {
          out('debug1: Authentications that can continue: publickey,password');
          out('debug1: Next authentication method: publickey');
          out('debug1: Offering public key: ' + (o.ident || HOME + '/.ssh/id_ed25519') + ' ED25519');
          out('debug1: Server accepts key');
          out('debug1: Authentication succeeded (publickey).');
        }
        afterAuth();
        return;
      }
      // password auth, up to 3 tries
      if (srv.banner && o.verbose) out('debug1: Next authentication method: password');
      var tries = 0;
      function ask() {
        promptRead(o.user + '@' + o.host + "'s password: ", { password: true }, function(pw) {
          if (pw === null) { addLine(''); return finish(130); }
          if (pw === srv.password) { afterAuth(); return; }
          tries++;
          if (tries >= 3) {
            addLine(o.user + '@' + o.host + ': Permission denied (publickey,password).');
            return finish(255);
          }
          addLine('Permission denied, please try again.');
          ask();
        });
      }
      ask();
    }

    tryKnownHost(doAuth);
    return 'async';
  }

  // ── Interactive launchers (standalone commands at the tty) ───────────────
  function runInteractive(name, args, cont) {
    if (name === 'sl') {
      var proc = runSL(args);
      if (proc) proc.onExit = function() { lastExit = 0; if (cont) cont(); };

  // Drunken-bishop randomart, seeded from the key bytes (stable per key).
  function randomArt(bytes, header, footer) {
    var W = 17, H = 9, x = 8, y = 4, i, grid = [];
    for (i = 0; i < H; i++) { grid.push([]); for (var c = 0; c < W; c++) grid[i].push(0); }
    var startX = x, startY = y;
    for (var b = 0; b < bytes.length; b++) {
      var byte = bytes[b];
      for (var s = 0; s < 4; s++) {
        var d = byte & 3; byte >>= 2;
        x += (d & 1) ? 1 : -1; y += (d & 2) ? 1 : -1;
        x = Math.max(0, Math.min(W - 1, x)); y = Math.max(0, Math.min(H - 1, y));
        grid[y][x]++;
      }
    }
    var sym = ' .o+=*BOX@%&#/^';
    var lines = [header];
    for (i = 0; i < H; i++) {
      var row = '|';
      for (var j = 0; j < W; j++) {
        if (i === startY && j === startX) row += 'S';
        else if (i === y && j === x) row += 'E';
        else row += sym.charAt(Math.min(grid[i][j], sym.length - 1));
      }
      lines.push(row + '|');
    }
    lines.push(footer);
    return lines;
  }

  function httpGet(url) {

    if (target && target.ssh && target.ssh.host === 'rainbow') {

      body = '<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="UTF-8">\n<title>guest@securit:~$</title></head>\n<body>\n<!-- securit.se — a terminal in your browser. You are looking at it. -->\n</body>\n</html>\n';

  function runSleep(args, cont) {
    var secs = parseFloat(args[0]);
    if (isNaN(secs) || secs < 0) {
      addLine("sleep: invalid number '" + (args[0] || '') + "'");
      lastExit = 1;
      return;
    }
    var pid = nextPid++;
    var proc = { pid: pid, command: 'sleep ' + args.join(' '), startTime: new Date(), status: 'running', jobId: null };
    processes[pid] = proc;
    foregroundPid = pid;
    disableTerminalInput();
    var timer = setTimeout(function() { finish(false); }, Math.min(secs, 86400) * 1000);
    function keyHandler(e) {
      if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); finish(true); }
    }
    function finish(interrupted) {
      clearTimeout(timer);
      document.removeEventListener('keydown', keyHandler);
      delete processes[pid];
      if (foregroundPid === pid) foregroundPid = null;
      if (interrupted) addLine('^C');
      lastExit = interrupted ? 130 : 0;
      enableTerminalInput();
      updatePrompt();
      scrollToBottom();
      if (!interrupted && cont) cont();
    }
    document.addEventListener('keydown', keyHandler);
    return 'async';
  }

  // ping at the tty: one packet per interval, reply after its RTT, Ctrl+C aborts with stats.
  function runPing(args, cont) {
    var count = null, host = null, interval = 1000;
    for (var i = 0; i < args.length; i++) {
      var a = args[i];
      if (a === '-c') count = parseInt(args[++i], 10);
      else if (a === '-i') interval = Math.max(100, Math.min(60000, (parseFloat(args[++i]) || 1) * 1000));
      else if (a === '-w' || a === '-W' || a === '-s') i++;
      else if (a.charAt(0) !== '-') host = a;
    }
    if (!host) { addLine('ping: usage error: Destination address required'); lastExit = 1; return; }
    var target = resolveHost(host);
    if (!target && !isIP(host)) { addLine("ping: bad address '" + host + "'"); lastExit = 1; return; }
    var ip = target ? target.ip : host;
    var n = count && count > 0 ? Math.min(count, 20) : 4;
    var pid = nextPid++;
    var proc = { pid: pid, command: 'ping ' + args.join(' '), startTime: new Date(), status: 'running', jobId: null };
    processes[pid] = proc;
    foregroundPid = pid;
    disableTerminalInput();
    addLine('PING ' + host + ' (' + ip + '): 56 data bytes');
    scrollToBottom();
    var times = [], sent = 0, timer = null;
    function sendNext() {
      var seq = sent++;
      var t = +(0.03 + Math.random() * (ip === '127.0.0.1' ? 0.05 : 8)).toFixed(3);
      timer = setTimeout(function() {
        times.push(t);
        addLine('64 bytes from ' + ip + ': seq=' + seq + ' ttl=64 time=' + t.toFixed(3) + ' ms');
        scrollToBottom();
        if (sent >= n) { finish(false); return; }
        timer = setTimeout(sendNext, Math.max(0, interval - t));
      }, t);
    }
    function keyHandler(e) {
      if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); finish(true); }
    }
    function finish(interrupted) {
      clearTimeout(timer);
      document.removeEventListener('keydown', keyHandler);
      delete processes[pid];
      if (foregroundPid === pid) foregroundPid = null;
      if (interrupted) addLine('^C');
      addLine('');
      addLine('--- ' + host + ' ping statistics ---');
      var loss = sent ? Math.round((sent - times.length) / sent * 100) : 0;
      addLine(sent + ' packets transmitted, ' + times.length + ' packets received, ' + loss + '% packet loss');
      if (times.length) {
        var min = Math.min.apply(null, times), max = Math.max.apply(null, times);
        var avg = times.reduce(function(x, y) { return x + y; }, 0) / times.length;
        addLine('round-trip min/avg/max = ' + min.toFixed(3) + '/' + avg.toFixed(3) + '/' + max.toFixed(3) + ' ms');
      }
      lastExit = times.length ? 0 : 1;
      enableTerminalInput();
      updatePrompt();
      scrollToBottom();
      if (!interrupted && cont) cont();
    }
    document.addEventListener('keydown', keyHandler);
    sendNext();
    return 'async';
  }

  function runYes(args, cont) {
    var word = args.length ? args.join(' ') : 'y';
    var pid = nextPid++;
    var proc = { pid: pid, command: 'yes' + (args.length ? ' ' + args.join(' ') : ''), startTime: new Date(), status: 'running', jobId: null, intervalId: null };
    processes[pid] = proc;
    foregroundPid = pid;
    disableTerminalInput();
    proc.intervalId = setInterval(function() {
      for (var i = 0; i < 32; i++) addLine(word);
      var lines = terminal.querySelectorAll('.line');
      for (var j = 0; j < lines.length - 2000; j++) lines[j].remove();
      scrollToBottom();
    }, 60);
    function keyHandler(e) {
      if (e.key === 'c' && e.ctrlKey) {
        e.preventDefault();
        clearInterval(proc.intervalId);
        document.removeEventListener('keydown', keyHandler);
        delete processes[pid];
        if (foregroundPid === pid) foregroundPid = null;
        addLine('^C');
        lastExit = 130;
        enableTerminalInput();
        updatePrompt();
        scrollToBottom();
      }
    }
    document.addEventListener('keydown', keyHandler);
    return 'async';
  }

  // ── vi (BusyBox-style modal editor; :w persists to browser storage) ─────
  function launchVi(args, cont) {
    var fileArg = null;
    for (var ai = 0; ai < args.length; ai++) {
      if (args[ai].charAt(0) !== '-') { fileArg = args[ai]; break; }
    }
    var path = fileArg ? normPath(fileArg) : null;
    var buf = [''];
    var newFile = true;
    if (path && fs[path]) {
      if (fs[path].type === 'dir') { addLine('vi: ' + fileArg + ': Is a directory'); lastExit = 1; return; }
      var r0 = readFile(path);
      if (r0.error) { addLine('vi: ' + fileArg + ': ' + r0.error); lastExit = 1; return; }
      buf = r0.content.split('\n');
      if (buf.length > 1 && buf[buf.length - 1] === '') buf.pop();
      if (!buf.length) buf = [''];
      newFile = false;
    }

      scrollToBottom();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var result = tabComplete(input.value);
      if (result.matches.length === 1) {
        input.value = applyCompletion(input.value, result);
        syncTyped();
      } else if (result.matches.length > 1) {
        // Show matches and fill common prefix
        addCommandLine(input.value);
        addLine(result.matches.join('  '));
        input.value = applyCompletion(input.value, result);
        syncTyped();
        scrollToBottom();
      }
    }
  });

  input.focus();
  window.addEventListener('focus', function() { input.focus(); });
})();
</script>
</body>
</html>
